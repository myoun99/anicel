# GitLab — the website, and nothing else.
#
# `docs/` IS the site: index.html, privacy.html and style.css, served exactly
# as they sit in the repository. GitHub Pages served this same folder until
# the account was suspended (2026-09-01) and took the pages down with it —
# among them the privacy policy App Store Connect shows TestFlight testers.
#
# ⛔NOT A SECOND COPY. GitLab publishes docs/ itself (`pages: publish`);
# nothing is copied for this host, in the repository or in the job. Whatever
# lands in docs/ is what this serves, because `tool/lane.sh land` mirrors
# every landing here.
#
# 🚨THE ADDRESS IS REGISTERED WITH APPLE. `ios/fastlane/Fastfile` holds it
# (SITE_URL), writes it into App Store Connect, and refuses to upload a
# TestFlight build while the pages served there differ from docs/ — so a
# mirror that stops, or a job here that fails, stops the next build instead
# of going stale where nobody looks.
#
# Only a push that changes the site runs this: every landing reaches this
# mirror, and republishing the same bytes would spend CI minutes on nothing.
# A pipeline started by hand always runs it — `changes` narrows pushes only
# — which is how to republish after a failure.
pages:
  image: alpine:latest
  variables:
    # One commit is all a publish needs.
    GIT_DEPTH: "1"
  # The pages are written by hand, so there is nothing to build; GitLab
  # still wants a script, and this one lists what goes out in the job log.
  script:
    - ls -l docs
  pages:
    publish: docs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - .gitlab-ci.yml
