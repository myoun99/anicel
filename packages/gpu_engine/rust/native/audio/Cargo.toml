[package]
name = "audio"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
media = { path = "../media" }
# The one resampler a sound is conformed with: a piece at another rate is
# put in the stream's with it (native-to-rust-Q11).
audio_mix = { path = "../audio_mix" }

# The bundled decoders (native-to-rust-Q4, the user: 「오디오는 symphonia
# 하나로」). ⛔Its defaults stay off: `opt-simd` sums the FFT in another
# order on each instruction set, and a sound decodes alike on every device
# (관제 audio-same-across-devices ③) — for which its maths is `libm`'s too:
# the workspace patches four of its crates (vendor/, native-to-rust-Q14).
# The formats are the ones the C's
# bundled decoders read — dr_wav · dr_flac · dr_mp3 · stb_vorbis — and the
# AAC-LC and ALAC of a movie the C left to the OS (native-to-rust-Q6).
symphonia = { version = "0.6.1", default-features = false, features = [
  "aac",
  "adpcm",
  "aiff",
  "alac",
  "flac",
  "isomp4",
  "mp1",
  "mp2",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }

# The OS stage on Windows: Media Foundation's source reader (os/
# media_foundation.rs); the crate is already in the lock as wgpu-hal's
# major.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

# The OS stage on Android: the NDK's MediaExtractor and MediaCodec (os/
# ndk.rs), through ndk-sys — bindings made from the NDK's own headers, never
# a table by hand (media's served_span.rs says why); already in the lock as
# cpal's.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6", features = ["media"] }

# The OS stage on Apple's: AudioToolbox's ExtAudioFile over the container's
# bytes (os/audio_toolbox.rs); both crates are already in the lock as
# cpal's, taken without their default features, which would pull in
# frameworks it has not.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-audio-toolbox = { version = "0.3", default-features = false, features = [
  "std",
  "AudioFile",
  "ExtendedAudioFile",
  "objc2-core-audio-types",
] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

# The C answer key: the engine's qa_audio_* (native/oracle), and the app's
# ledger (native/ledger).
[dev-dependencies]
ledger = { path = "../ledger" }
oracle = { path = "../oracle" }
