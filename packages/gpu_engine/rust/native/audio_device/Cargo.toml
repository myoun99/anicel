[package]
name = "audio_device"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
audio_mix = { path = "../audio_mix" }
# The OS's sound (native-to-rust-Q7, user 2026-11-06: 「cpal 을 받고, 다른
# 점 셋은 직접 덧댄다」) — Apache-2.0.
cpal = "0.18.2"

[target.'cfg(unix)'.dependencies]
# clock_gettime(CLOCK_MONOTONIC), the clock the C's lines are drawn on.
libc = "0.2"

# The C answer key: the engine's qa_audio_buffer_*, its transport's doors
# and its null device (native/oracle).
[dev-dependencies]
oracle = { path = "../oracle" }
