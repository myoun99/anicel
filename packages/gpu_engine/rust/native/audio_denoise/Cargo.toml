[package]
name = "audio_denoise"
version = "0.0.1"
edition = "2024"
publish = false

# A take is denoised alike on every device (유저 gpu-same-formula-Q2): the
# window's, the DCT's and the FFT's sin and cos and each band's log10 are
# libm's, the same Rust on every OS, not the device's maths library, which
# rounds its last place differently from OS to OS — as symphonia's are
# (native-to-rust-Q14), and so a ledger row can hold them
# (connection-round-checklist A, 관제 2026-11-07 ③); already in the lock
# as zeno's.
[dependencies]
libm = "0.2"

# The answer key: the app's ledger (native/ledger), whose rows were
# pinned beside the engine's C qa_audio_denoise_f32 — gone in the connection
# round (H).
[dev-dependencies]
ledger = { path = "../ledger" }
