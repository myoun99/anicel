[package]
name = "pen"
version = "0.0.1"
edition = "2024"
publish = false

# The pen's driver, its HID reports and the windows they are scoped to:
# wgpu-hal's own `windows`, already in the lock. Its features are its own
# modules and pull no crate in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }

# Apple's touches and events, asked by message, and the main queue the
# event monitor is installed from: wgpu-hal's own Objective-C crates,
# already in the lock, with the features it takes.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"

# The C this crate replaces (qa_tablet_win.c, qa_penraw_win.c), the answer
# key until the connection round — and a tablet driver both of them load in
# its place, so their readings are held to each other on the same packets.
[dev-dependencies]
oracle = { path = "../oracle" }
wintab_fake = { path = "wintab_fake" }
