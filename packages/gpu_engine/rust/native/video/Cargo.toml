[package]
name = "video"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
media = { path = "../media" }

# Media Foundation's writer and reader (the path is widened by media's
# path); the crate is already in the lock as wgpu-hal's major. The reader
# seeks with a PROPVARIANT, which the last two features bring.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

# The NDK's MediaCodec and MediaMuxer, through ndk-sys — bindings made from
# the NDK's own headers, never a table by hand (media's served_span.rs says
# why; this crate's own hand copy, ndk.rs, went 2026-11-07) — and libc for
# open/close of the output file the muxer writes into.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
ndk-sys = { version = "0.6", features = ["media"] }

# AVFoundation's writer and reader (qa_video_apple.m's AVAssetWriter and
# AVAssetReader halves). Every crate but AVFoundation's and CoreMedia's was
# already in the lock (wgpu-hal, cpal, pen's dispatch2); their default
# features would pull in frameworks it has not. The reader serves a span
# through a resource loader, whose delegate is called on a dispatch queue.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "AVAsset",
  "AVAssetReader",
  "AVAssetReaderOutput",
  "AVAssetResourceLoader",
  "AVAssetTrack",
  "AVAssetWriter",
  "AVAssetWriterInput",
  "AVMediaFormat",
  "AVVideoSettings",
  "block2",
  "dispatch2",
  "objc2-core-foundation",
  "objc2-core-media",
  "objc2-core-video",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSettings"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
  "std",
  "CMBase",
  "CMBlockBuffer",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMTime",
  "CMTimeRange",
  "objc2-core-audio-types",
  "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVPixelBufferPool",
  "CVReturn",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSFileManager",
  "NSObject",
  "NSString",
  "NSURL",
  "NSValue",
  "objc2-core-foundation",
] }

# The C answer key: the engine's qa_video_export_* (native/oracle).
[dev-dependencies]
oracle = { path = "../oracle" }
