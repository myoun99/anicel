[package]
name = "gpu_engine"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
# Both kinds are required by native_toolchain_rust.
crate-type = ["staticlib", "cdylib"]
# ⛔NOT `gpu_engine`, the package's name: on Apple's the plugin's pod is
# gpu_engine.framework (CocoaPods names it after the plugin), and Flutter
# wraps a code asset libX.dylib as X.framework without looking at the
# pods' names — the two met in one place, and the macOS app found no
# gpu_engine_open_sole in the gpu_engine it opened (GPU engine run
# 42349881697, 2026-11-07). Dart binds the library by its asset's id
# (lib/src/engine_ffi.dart), never by this name.
# ⚠️Android's Kotlin opens it by THIS name (`System.loadLibrary` in the
# plugin's classes), and was missed when it was renamed: every Android
# build found no library (board android-loads-the-engine-by-its-old-name,
# 2026-11-16). test/architecture/
# a_native_library_is_opened_by_the_name_it_is_built_as_test.dart reads
# the two against each other.
name = "gpu_engine_core"

[dependencies]
# The fingerprint: the same CRC-32 as the app's anicelCrc32, not a hash of
# our own (gpu-engine-skeleton, 2026-11-05).
crc32fast = "1"
# The app's native modules this library carries, each exported from here
# (src/lib.rs names it — the workspace note below says why it must).
audio = { path = "native/audio" }
audio_device = { path = "native/audio_device" }
audio_mix = { path = "native/audio_mix" }
compress = { path = "native/compress" }
display = { path = "native/display" }
fx_plugin = { path = "native/fx_plugin" }
# A GPU fx plugin (fx spec 2): checked and counted there, run here on the
# engine's device (kernels/plugin).
fx_wgsl = { path = "native/fx_wgsl" }
# A still JPEG's pixels, decoded on the worker that lays them (board
# a-raster-import-goes-gpu-cpu-gpu-cpu-Q2, 2026-11-15) — zune-jpeg, pure Rust.
image_decode = { path = "native/image_decode" }
image_encode = { path = "native/image_encode" }
media = { path = "native/media" }
memory = { path = "native/memory" }
pen = { path = "native/pen" }
# A tile's bytes premultiplied for its picture's upload, four pixels a step
# — the last kernel the app took from the C engine.
premultiply = { path = "native/premultiply" }
# A tile's block of pixels, and the lists a freed one waits on — the last
# memory the app took from the C engine.
tile_blocks = { path = "native/tile_blocks" }
# ↩️The NV12 pass's tests held it to video's `from_rgba` byte for byte
# (관제 2026-11-12, gpu-export-path ⑶-3 ①) till that went with the RGBA
# road (board trimmed-movie-decodes-to-nv12-Q2, 2026-11-15): the law's
# sums are the pass's alone, held to hand-worked cases.
video = { path = "native/video" }
# A Gaussian's weights are alike on every device (유저 gpu-same-formula-Q2):
# their exp is libm's, the same Rust on every OS, not the device's maths
# library — as the audio crates' sin and pow are; already in the lock as
# zeno's.
libm = "0.2"
pollster = "0.4"
# The engine sets canvas letters itself (engine-canvas-letters; 🗣️유저
# gpu-int-spec-word-bake-Q1 「엔진이 글자를 직접 그린다」, the crates allowed
# in chat 2026-11-07 「허락할게」, -Q3): read-fonts reads a face's charmap and
# its outlines in font units, harfrust turns a cluster's text into the
# face's glyphs as HarfBuzz does, zeno rasters an outline to coverage.
# zeno's `libm`, not `std`: its stroker's curve maths is then the same Rust
# on every OS, never the platform's maths library.
harfrust = "=0.15.0"
read-fonts = "=0.46.0"
zeno = { version = "=0.3.3", default-features = false, features = ["eval", "libm"] }
wgpu = { version = "=30.0.1", default-features = false, features = [
  "std",
  "parking_lot",
  "dx12",
  "wgsl",
] }

# The same major as wgpu-hal 30's own `windows`, so the D3D12 types this
# crate makes are the ones wgpu-hal wraps.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
  # A face's file mapped, not copied (kernels/letters/mapped.rs).
  "Win32_System_Memory",
  # Where a view of a span may begin (kernels/letters/mapped.rs).
  "Win32_System_SystemInformation",
] }

# A face's file mapped, not copied (kernels/letters/mapped.rs): mmap, as
# libc says it on every unix; already in the lock as the audio crates'.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Android presents through Vulkan (platform/android.rs); Cargo adds this
# feature to the wgpu above, on Android only.
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }
# What the device says of an AHardwareBuffer's image is asked of Vulkan
# itself (platform/android.rs, `hardware_buffer_said`); ash is wgpu-hal
# 30's own major, as on Linux below.
ash = "0.38"

# Apple shows the engine through an IOSurface (platform/apple.rs); Cargo
# adds Metal to the wgpu above, on Apple only. The objc2 majors are
# wgpu-hal 30's own, so the Metal types this crate makes are the ones it
# wraps.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVPixelBufferIOSurface",
  "CVReturn",
  "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3", default-features = false, features = [
  "std",
  "IOSurfaceRef",
  "objc2-core-foundation",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
  "std",
  "MTLAllocation",
  "MTLDevice",
  "MTLPixelFormat",
  "MTLResource",
  "MTLTexture",
  "objc2-io-surface",
] }

# Linux shows the engine through a dma-buf of a Vulkan image
# (platform/linux.rs); ash is wgpu-hal 30's own major, so the Vulkan
# handles this crate makes are the ones it wraps.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }
ash = "0.38"

# The Linux test maps the dma-buf to read what Flutter is handed.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# build.rs checks the pinned dxcompiler.dll against its SHA-256.
[build-dependencies]
sha2 = "0.10"

# The tests read the ledger, test/fixtures/fingerprints.json, through the
# workspace's one reader; the letters' tests read a fixture of their own.
# A folder a test keeps shaders in goes with the test (native/oracle's
# `TempFile`, the native crates' one guard).
[dev-dependencies]
ledger = { path = "native/ledger" }
oracle = { path = "native/oracle" }
serde_json = "1"

# THE APP'S NATIVE C MOVES HERE, A MODULE TO A CRATE (native-to-rust, 유저
# 2026-11-06 via 관제: no C left — what we wrote, third_party, .m, .cpp).
# A lane moves one module whole, the C it calls with it, and touches only
# its own folder under native/: these globs take a new crate in without a
# line here, and `cargo test` in this folder runs every crate. ↩️Until
# the connection round each module's Rust was held to the C byte for byte
# (native/oracle, the answer key then); that round linked the modules into
# this library and deleted the C, the last of it on 2026-11-13.
# ⚠️ONE LIBRARY, AND IT MUST NAME WHAT IT CARRIES. A crate this one depends
# on but never names is not linked, and its extern "C" functions are not
# exported — measured 2026-11-06 on a scratch workspace: the dependency
# alone exported nothing, `extern crate` or `pub use` exported them.
# ⚠️THE LOCK IS SHARED: two lanes that add crates both touch Cargo.lock.
# On a rebase conflict there, take the trunk's lock and let Cargo add the
# lane's crates back (`cargo build --offline`) — never resolve it by hand.
[workspace]
members = ["native/*"]
default-members = [".", "native/*"]
# The vendored crates below are patched in, not members: `cargo test` here
# runs this workspace's tests, not theirs.
exclude = ["vendor"]

# 🚨SYMPHONIA IS OURS TO PATCH (유저 native-to-rust-Q14, 2026-11-07: 「고친
# 사본을 묶는다」 — 「릴리즈할때 리포 링크 공개할예정」, so this repository
# is where the modified source is offered, as MPL-2.0 asks). A sound
# decodes alike on every device (유저 gpu-same-formula-Q2), and symphonia
# made its tables and some of each frame's values with Rust's `f32`/`f64`
# `sin` · `cos` · `tan` · `powf` · `exp` · `atan` — the device's own maths
# library, which rounds its last place differently from OS to OS: the
# first CI run (42274856506) decoded the AAC fixture alike on Linux x64
# and Windows ARM64 and otherwise on Windows x64, and the MP3 otherwise on
# the Mac. Those fifteen places call `libm` instead — the same Rust on
# every OS, as zeno's does above — and each file says so under its MPL
# header. No setting of symphonia's picks this; ⚠️EVERY UPGRADE OF
# SYMPHONIA DOES IT AGAIN: copy the new release's four crates here, route
# every std maths call in them through `libm` (grep their `src` for
# `.sin()` · `.cos()` · `.tan()` · `powf` · `.exp()` · `.atan()`), and
# pin the new fingerprints (native/audio/src/tests/pins.rs).
[patch.crates-io]
symphonia-core = { path = "vendor/symphonia-core" }
symphonia-codec-aac = { path = "vendor/symphonia-codec-aac" }
symphonia-bundle-mp3 = { path = "vendor/symphonia-bundle-mp3" }
symphonia-codec-vorbis = { path = "vendor/symphonia-codec-vorbis" }
# 🚨WGPU-HAL IS OURS TO PATCH TOO (유저 2026-11-13,
# the-wait-window-stands-seven-seconds-on-the-surface-Q1: 「고친 사본을 묶는다
# — 디스크 캐시 + 나란히 컴파일」). DXC was nine tenths of every compile the
# app's wait window stood for on the Surface Pro 11, and wgpu-hal 30 kept
# none of what it made past the run and compiled on one compiler from every
# thread: what DXC makes, and what the driver makes of each pipeline on it,
# is now kept on disk (src/dx12/compile_cache.rs) and
# each compile under way takes a compiler of its own
# (src/dx12/shader_compilation.rs, `DxcCompilers`). Every change of ours
# says ANICEL. ⚠️EVERY UPGRADE OF WGPU DOES IT AGAIN: copy the new
# release's wgpu-hal here whole from the registry, put back what
# `grep -rn ANICEL vendor/wgpu-hal` finds in this one, and run this crate's
# tests on Windows. MIT/Apache-2.0: no source has to be offered.
wgpu-hal = { path = "vendor/wgpu-hal" }
# 🚨ZUNE-JPEG IS OURS TO PATCH TOO (유저 2026-11-15,
# a-jpeg-that-lies-about-its-size-can-end-the-app-Q1: 「고친 사본을 묶는다」).
# A progressive JPEG's coefficients — and a baseline one's whose components
# come in scans of their own — are taken inside the decoder as it decodes,
# the size the file's header says, and zune-jpeg 0.5.15 took them with
# `vec!`: where there is no room for them a `vec!` ends the process, the
# app with it. Those two places answer an error now (src/mcu_prog.rs ·
# src/mcu.rs, through `anicel_zeroed_coefficients` in src/misc.rs), which
# native/image_decode hands the import as why the file did not decode.
# Every change of ours says ANICEL. ⚠️EVERY UPGRADE OF ZUNE-JPEG DOES IT
# AGAIN: copy the new release here from the registry (its Cargo.lock and
# .gitignore, and cargo's .cargo-ok, left out — nothing is built from
# them), put back what `grep -rn ANICEL vendor/zune-jpeg` finds in this
# one, and run native/image_decode's tests — they end at the first place
# left unmended. One of what the grep finds is not a mend: the line of
# src/lib.rs that reads QA_CHECKOUT, which the engine asks of every crate
# built here (src/kernels/shared/one_checkout.rs — its test names the
# copy when the line is not put back). MIT OR Apache-2.0 OR Zlib: no source
# has to be offered, and each altered place is marked.
zune-jpeg = { path = "vendor/zune-jpeg" }

# A DEPENDENCY'S DEBUG INFO IS ITS LINE TABLES (브러시/렌더링 23:09 · 관제
# 2026-11-07, connection-round-checklist): the shared target had grown to
# 47 GB, 42 of it debug builds. A dependency's frames keep their names and
# lines in a dump and a backtrace, and no one has stepped into wgpu or naga
# with a debugger; this workspace's own crates keep their full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"
