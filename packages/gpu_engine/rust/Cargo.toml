[package]
name = "gpu_engine"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
# Both kinds are required by native_toolchain_rust.
crate-type = ["staticlib", "cdylib"]
# ⛔NOT `gpu_engine`, the package's name: on Apple's the plugin's pod is
# gpu_engine.framework (CocoaPods names it after the plugin), and Flutter
# wraps a code asset libX.dylib as X.framework without looking at the
# pods' names — the two met in one place, and the macOS app found no
# gpu_engine_open_sole in the gpu_engine it opened (GPU engine run
# 42349881697, 2026-11-07). Dart binds the library by its asset's id
# (lib/src/engine_ffi.dart), never by this name.
name = "gpu_engine_core"

[dependencies]
# The fingerprint: the same CRC-32 as the app's anicelCrc32, not a hash of
# our own (gpu-engine-skeleton, 2026-11-05).
crc32fast = "1"
# The app's native modules this library carries, each exported from here
# (src/lib.rs names it — the workspace note below says why it must).
display = { path = "native/display" }
fx_plugin = { path = "native/fx_plugin" }
pollster = "0.4"
# The engine sets canvas letters itself (engine-canvas-letters; 🗣️유저
# gpu-int-spec-word-bake-Q1 「엔진이 글자를 직접 그린다」, the crates allowed
# in chat 2026-11-07 「허락할게」, -Q3): read-fonts reads a face's charmap and
# its outlines in font units, harfrust turns a cluster's text into the
# face's glyphs as HarfBuzz does, zeno rasters an outline to coverage.
# zeno's `libm`, not `std`: its stroker's curve maths is then the same Rust
# on every OS, never the platform's maths library.
harfrust = "=0.15.0"
read-fonts = "=0.46.0"
zeno = { version = "=0.3.3", default-features = false, features = ["eval", "libm"] }
wgpu = { version = "=30.0.1", default-features = false, features = [
  "std",
  "parking_lot",
  "dx12",
  "wgsl",
] }

# The same major as wgpu-hal 30's own `windows`, so the D3D12 types this
# crate makes are the ones wgpu-hal wraps.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
] }

# Android presents through Vulkan (platform/android.rs); Cargo adds this
# feature to the wgpu above, on Android only.
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

# Apple shows the engine through an IOSurface (platform/apple.rs); Cargo
# adds Metal to the wgpu above, on Apple only. The objc2 majors are
# wgpu-hal 30's own, so the Metal types this crate makes are the ones it
# wraps.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVPixelBufferIOSurface",
  "CVReturn",
  "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3", default-features = false, features = [
  "std",
  "IOSurfaceRef",
  "objc2-core-foundation",
] }
objc2-metal = { version = "0.3", default-features = false, features = [
  "std",
  "MTLAllocation",
  "MTLDevice",
  "MTLPixelFormat",
  "MTLResource",
  "MTLTexture",
  "objc2-io-surface",
] }

# Linux shows the engine through a dma-buf of a Vulkan image
# (platform/linux.rs); ash is wgpu-hal 30's own major, so the Vulkan
# handles this crate makes are the ones it wraps.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }
ash = "0.38"

# The Linux test maps the dma-buf to read what Flutter is handed.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

# build.rs checks the pinned dxcompiler.dll against its SHA-256.
[build-dependencies]
sha2 = "0.10"

# The tests read the ledger, test/fixtures/fingerprints.json, through the
# workspace's one reader; the letters' tests read a fixture of their own.
[dev-dependencies]
ledger = { path = "native/ledger" }
serde_json = "1"
# The NV12 pass is held to video's `from_rgba` byte for byte while the
# movie writers run it on the CPU (공통, gpu-export-path 2026-11-07 23:20
# ④); the pin goes when 7′ deletes it.
video = { path = "native/video" }

# THE APP'S NATIVE C MOVES HERE, A MODULE TO A CRATE (native-to-rust, 유저
# 2026-11-06 via 관제: no C left — what we wrote, third_party, .m, .cpp).
# A lane moves one module whole, the C it calls with it, and touches only
# its own folder under native/: these globs take a new crate in without a
# line here, and `cargo test` in this folder runs every crate. Until the
# connection round each module's Rust is held to the C byte for byte
# (native/oracle); that round links the modules into this library and
# deletes the C.
# ⚠️ONE LIBRARY, AND IT MUST NAME WHAT IT CARRIES. A crate this one depends
# on but never names is not linked, and its extern "C" functions are not
# exported — measured 2026-11-06 on a scratch workspace: the dependency
# alone exported nothing, `extern crate` or `pub use` exported them.
# ⚠️THE LOCK IS SHARED: two lanes that add crates both touch Cargo.lock.
# On a rebase conflict there, take the trunk's lock and let Cargo add the
# lane's crates back (`cargo build --offline`) — never resolve it by hand.
[workspace]
members = ["native/*"]
default-members = [".", "native/*"]
# The vendored crates below are patched in, not members: `cargo test` here
# runs this workspace's tests, not theirs.
exclude = ["vendor"]

# 🚨SYMPHONIA IS OURS TO PATCH (유저 native-to-rust-Q14, 2026-11-07: 「고친
# 사본을 묶는다」 — 「릴리즈할때 리포 링크 공개할예정」, so this repository
# is where the modified source is offered, as MPL-2.0 asks). A sound
# decodes alike on every device (유저 gpu-same-formula-Q2), and symphonia
# made its tables and some of each frame's values with Rust's `f32`/`f64`
# `sin` · `cos` · `tan` · `powf` · `exp` · `atan` — the device's own maths
# library, which rounds its last place differently from OS to OS: the
# first CI run (42274856506) decoded the AAC fixture alike on Linux x64
# and Windows ARM64 and otherwise on Windows x64, and the MP3 otherwise on
# the Mac. Those fifteen places call `libm` instead — the same Rust on
# every OS, as zeno's does above — and each file says so under its MPL
# header. No setting of symphonia's picks this; ⚠️EVERY UPGRADE OF
# SYMPHONIA DOES IT AGAIN: copy the new release's four crates here, route
# every std maths call in them through `libm` (grep their `src` for
# `.sin()` · `.cos()` · `.tan()` · `powf` · `.exp()` · `.atan()`), and
# pin the new fingerprints (native/audio/src/tests/pins.rs).
[patch.crates-io]
symphonia-core = { path = "vendor/symphonia-core" }
symphonia-codec-aac = { path = "vendor/symphonia-codec-aac" }
symphonia-bundle-mp3 = { path = "vendor/symphonia-bundle-mp3" }
symphonia-codec-vorbis = { path = "vendor/symphonia-codec-vorbis" }

# A DEPENDENCY'S DEBUG INFO IS ITS LINE TABLES (브러시/렌더링 23:09 · 관제
# 2026-11-07, connection-round-checklist): the shared target had grown to
# 47 GB, 42 of it debug builds. A dependency's frames keep their names and
# lines in a dump and a backtrace, and no one has stepped into wgpu or naga
# with a debugger; this workspace's own crates keep their full debug info.
[profile.dev.package."*"]
debug = "line-tables-only"
