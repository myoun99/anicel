# native_toolchain_rust refuses a bare `stable`: the version is pinned so
# every machine and runner builds the engine with the same compiler.
# Stage 0 is Windows x64 only (this PC and the Surface Pro 11, Intel);
# further targets join with their stage.
[toolchain]
channel = "1.99.1"
profile = "minimal"
targets = [
  "x86_64-pc-windows-msvc",
]
