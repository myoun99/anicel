// The Android side of the FFI plugin: Gradle drives the SAME CMake the
// desktop builds use, and the resulting libqa_engine.so lands in jniLibs
// for every ABI the app builds.
group = 'com.quickanimaker.qa_native'
version = '1.0'

apply plugin: 'com.android.library'

android {
    namespace = 'com.quickanimaker.qa_native'
    compileSdk = 35

    defaultConfig {
        // The app's own floor (android/app/build.gradle.kts): Android 10.
        // The media decoders read a FRAMED span through a data source, which
        // is API 28 — 21 here promised devices the app no longer serves
        // (board skia-devices-out-of-release, 2026-10-24).
        // ⚠️It is also the C's compile floor: miniaudio takes its API 28+
        // branches from here on (an explicit thread schedule, dlclose of the
        // backend library) — the ones it takes on every other POSIX system.
        minSdk = 29
    }

    externalNativeBuild {
        cmake {
            path = file('../src/CMakeLists.txt')
        }
    }
}
