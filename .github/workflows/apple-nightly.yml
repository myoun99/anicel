name: Apple nightly suite

# The BROAD half of Apple coverage, on the cadence it was designed for.
# Until 2026-08-27 this ran as a step of apple.yml's push-triggered
# compile job — which meant any PR touching ios/ or macos/ waited ~27
# minutes for a nightly-shaped suite, because merge_check counts a
# PENDING check as a block (board Q-apple-gate-time). It lives in its
# own workflow rather than as an if-gated job in apple.yml because a
# skipped job still registers a check on every push, and merge_check
# reads anything that is not SUCCESS or PENDING as a failure.
#
# ⛔Do not narrow this to the parity subset because testflight.yml runs
# that subset on every build. The two are deliberately different
# shapes: that one is NARROW and unskippable, this one is BROAD and
# nightly. Narrowing here would leave macOS-only Dart defects — path
# separators, file locking, Platform.isMacOS branches — with nothing
# looking for them at all, and nobody is waiting on this job at 03:00
# UTC.
on:
  schedule:
    # 03:00 UTC = 12:00 KST, once a day — same slot as apple.yml.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: apple-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  apple-suite:
    name: full suite on macOS (shard ${{ matrix.shard }})
    runs-on: macos-latest
    # A shard is ~9 minutes of tests over ~4 of setup; 30 bounds a hang.
    timeout-minutes: 30
    strategy:
      # One red shard must not hide what the other two would have said.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      # The dylib built below, so the PARITY tests actually RUN here
      # instead of skipping. That is the real prize of a Mac runner: it
      # tells us whether Apple clang on arm64 produces the same bytes as
      # the Dart reference — fp contraction and NEON vectorization are
      # exactly the kind of thing that could diverge silently on a
      # platform nobody here owns. Platform-conditional code
      # (Platform.isMacOS branches in the input/sidecar layers) only
      # executes on this runner too.
      QA_ENGINE_PATH: ${{ github.workspace }}/build/ci-apple/libqa_engine.dylib
      # And QA_REQUIRE_NATIVE turns a MISSING engine into a failure
      # instead of a quiet skip. A skipped parity suite and a passing
      # one look identical in a CI summary, which is precisely how #614
      # hid for five rounds.
      QA_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v5
      # Same host build as apple.yml's compile job — each shard rebuilds
      # its own dylib (~26s) rather than depending on an artifact
      # hand-off.
      - name: Native core (Apple clang, host)
        run: |
          cmake -S packages/qa_native/src -B build/ci-apple -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-apple --config Release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Build hooks (pdfium_dart, sqlite3) download prebuilt binaries
      # during ANY flutter test; cached for the same reason as in ci.yml.
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Run tests (engine loaded, parity tests live)
        uses: ./.github/actions/test-shard
        with:
          total: 3
          index: ${{ matrix.shard }}
