name: TestFlight (iOS)

# The DELIVERY tier. `apple.yml` answers "does it compile on Apple?"; this
# one answers "can I hold it on the iPad?" — a signed device build pushed
# to TestFlight.
#
# Once a night, and on demand. Not on every push: master takes ten or more
# merges on a working day, and since a build cannot start while another is
# running they would queue for hours to deliver versions nobody asked to
# look at. A night build carries the whole day's work instead, and is on
# the iPad before the next one starts.
on:
  schedule:
    # 21:00 UTC = 06:00 JST — after the late merges, before the morning.
    - cron: '0 21 * * *'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  testflight:
    name: Signed device build -> TestFlight
    runs-on: macos-latest
    # Measured 7-12 minutes including the parity check; 30 bounds a hang.
    # A build that stalls must not sit for six hours holding the
    # `testflight` concurrency group and blocking the nightly behind it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # The Apple-side correctness check lives HERE, before anything
      # expensive, rather than in a separate workflow somebody has to
      # remember to run.
      #
      # `apple.yml` answers the same question, but it is a nightly job and
      # a build is not: shipping meant either waiting 32 minutes for a
      # dispatched run or reasoning about whether the last one had seen
      # this commit. That reasoning went wrong on 2026-08-14 — the newest
      # apple.yml success was a BRANCH run, not master, and it took a
      # second look to notice. A check the release path cannot skip is
      # worth more than a check that is thorough somewhere else.
      #
      # Only the tests that touch the native engine run here: 37 files of
      # 735, selected by what they import rather than from a list that
      # would rot. The other 698 have already run on Linux and Windows for
      # this commit, and running them a third time is what makes apple.yml
      # take 26 minutes.
      - name: Native core (Apple clang)
        run: |
          cmake -S packages/qa_native/src -B build/ci-apple -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-apple --config Release
      - name: Parity against the Apple-built engine
        env:
          QA_ENGINE_PATH: ${{ github.workspace }}/build/ci-apple/libqa_engine.dylib
          # A missing engine must FAIL rather than skip: a skipped parity
          # suite and a passing one look identical in a summary, which is
          # exactly how #614 hid for five rounds.
          QA_REQUIRE_NATIVE: '1'
        run: |
          set -euo pipefail
          # `|| true` because grep exits 1 on no matches, and under `set -e`
          # that would kill the step before the guard below could say why.
          grep -rl 'native_engine_path\|qa_engine_abi\|QaNativeEngine\|src/native/' \
            test --include='*_test.dart' | sort > "$RUNNER_TEMP/parity.txt" || true
          count=$(wc -l < "$RUNNER_TEMP/parity.txt")
          echo "parity subset: $count of $(find test -name '*_test.dart' | wc -l) files"
          # A selector that matched nothing would sail through green — the
          # one way this check could quietly stop checking.
          if [ "$count" -eq 0 ]; then
            echo "no parity tests selected"
            exit 1
          fi
          xargs flutter test --no-pub < "$RUNNER_TEMP/parity.txt"

      # Flutter's own artifacts first (the Dart AOT snapshot, the engine,
      # the qa_native pod). fastlane's build_app then archives and signs
      # what this produced — signing here would be thrown away.
      #
      # --build-number is how the version reaches the bundle at all:
      # CFBundleVersion is $(FLUTTER_BUILD_NUMBER), which lands in
      # Generated.xcconfig from right here. It has to climb, because App
      # Store Connect rejects a build number it has already seen, and the
      # run number climbs on its own.
      - name: Build Flutter iOS artifacts
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Build and upload
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          FASTLANE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The private repository holding the encrypted signing identity,
          # and the passphrase that opens it.
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          # Non-interactive: a prompt on a runner is a 6-hour hang.
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: |
          # match clones over HTTPS, so the token has to arrive the way git
          # expects it — base64 of "user:token". Built here rather than
          # stored pre-encoded, so the secret stays a plain token.
          # tr strips the wrap GNU base64 would add; a newline in the
          # header is an auth failure that reads like a wrong token.
          MATCH_GIT_BASIC_AUTHORIZATION=$(
            printf 'x-access-token:%s' "$MATCH_GIT_TOKEN" | base64 | tr -d '\n'
          )
          export MATCH_GIT_BASIC_AUTHORIZATION
          bundle exec fastlane beta

      # The logs are where a signing failure explains itself, and they
      # outlive the runner only if we say so.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            ios/build/*.ipa
            /Users/runner/Library/Logs/gym/*.log
          if-no-files-found: ignore
          retention-days: 7
