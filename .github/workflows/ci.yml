name: CI

# The cheap tier: analyze and the full test suite (↩️and a portability
# check on the native C core, till the C went — 2026-11-13). PRs run
# against the virtual merge with master; pushes
# to master verify the merged result. Branch pushes alone don't trigger —
# every branch goes through a PR anyway, and running both events doubled
# every run for nothing (workflow_dispatch covers the rare PR-less case).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A PR keeps ONE group, so pushing a fix supersedes the run it replaces —
# that is the behaviour worth keeping. A master push must NOT: consecutive
# merges land minutes apart and shared a single group, so each new merge
# killed the previous one's run. Measured on 2026-08-12: 11 of 21 master
# pushes were cancelled that way, burning 364 runner-minutes and leaving
# master with a completed verdict on only 9 of 21 commits. Giving pushes a
# per-commit group lets every merged commit finish and say something.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  # 🚨★★★DOES THIS CHANGE TOUCH THE APP AT ALL?
  #
  # 유저 2026-08-31: 「무슨 보드는 내 컴퓨터에서만 하는데 안드로이드 빌드
  # 네이티브c 이딴게 왜필요한거야?」 — it does not. `tool/board_*.dart` is a
  # dev script that runs on one machine and ships in nothing; a one-file edit
  # to it was buying an Android build, a Windows app build, a native C
  # portability check and six Windows shards. Twelve checks for a page nobody
  # else ever loads.
  #
  # ⚠️`analyze + full test suite` STILL RUNS, always. It is the merge gate
  # (`flutter analyze` with no arguments) and it runs the 105 board tests. The
  # jobs that stand down are the ones whose whole question is 「does the APP
  # still compile and link」, which a board edit cannot affect.
  #
  # ⛔FAIL-SAFE: anything this cannot work out means `app=true`. A shallow
  # clone, a force-push, a workflow_dispatch with no diff to read — every one
  # of those runs everything, because the cost of a needless build is minutes
  # and the cost of a skipped one is a broken master.
  #
  # ⚠️Job-level `if`, not a workflow-level `paths:` filter. A filtered-out
  # workflow reports NO check at all, and 「체크 0개」 is not green, it is
  # unverified — `merge_check.sh` counts checks and would have to learn a
  # second meaning for zero. A skipped JOB still posts its check.
  #
  # 🔁AND HAS THIS TREE BEEN TESTED GREEN ALREADY? (ci-takes-an-hour-on-lavapipe,
  # 관제 2026-11-17 for 유저 「CI 너무 긴거아닌가」). A bundle PR merged with
  # `gh pr merge --merge` pushes a merge commit whose tree is the PR head's —
  # and master's run went through that same tree once more: 30 + 29 minutes
  # on 11-06, 26 + 25 on 11-03, the second telling nothing the first had not.
  # So a master push whose tree is a commit's that a pull_request run of this
  # workflow passed (the pushed commit itself, or a merge's second parent)
  # sets `again`, and every job below stands down; the run still ends green,
  # which is what tool/build_check.sh reads. ⚠️A board-only push straight to
  # master has no such run, so it runs as before — that run is its gate. The
  # fail-safe above holds: a tree that differs, a call that fails, any doubt
  # at all, and `again` stays false.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.what.outputs.app }}
      again: ${{ steps.again.outputs.again }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: what
        shell: bash
        run: |
          app=true
          base=""
          head="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          fi
          if git cat-file -e "$base^{commit}" 2>/dev/null \
            && git cat-file -e "$head^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$base" "$head" || true)
            if [ -n "$files" ]; then
              # Everything outside the board's own files makes it an app change.
              # ⚠️No pipe into `grep -q`: it leaves at the first app file, the
              # writer still writing the rest dies of SIGPIPE, and under the
              # step's pipefail that failure read as 「nothing but board
              # files」 — the 2026-10-24 bundle PR (#1483, 937 files) was
              # judged app=false and its Windows shards, Windows app, Android
              # and native C checks stood down. A here-string has no writer.
              if ! grep -qvE '^(tool/board_[a-z_]+\.dart|test/tool/)' \
                <<< "$files"; then
                app=false
              fi
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "app=$app  (${files:-<no diff read>})"
      - id: again
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          again=false
          head="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            tree=$(git rev-parse --verify -q "$head^{tree}" || true)
            second=$(git rev-parse --verify -q "$head^2" || true)
            for c in "$head" $second; do
              [ -n "$tree" ] || break
              [ "$(git rev-parse --verify -q "$c^{tree}" || true)" = "$tree" ] \
                || continue
              green=$(gh api \
                "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$c&event=pull_request&status=success&per_page=1" \
                --jq '.total_count' 2>/dev/null || true)
              if [ "${green:-0}" -gt 0 ] 2>/dev/null; then
                again=true
                echo "tree ${tree:0:12} passed as pull-request head ${c:0:12}"
                break
              fi
            done
          fi
          echo "again=$again" >> "$GITHUB_OUTPUT"
          echo "again=$again"
      # ⏱️WHAT EACH TEST FILE TOOK LAST TIME (ci-shards-dealt-by-measured-
      # seconds, 2026-11-17): the shards deal their files by it
      # (tool/test_shard.dart). Fetched HERE, once, and handed to every
      # shard as one artifact — a shard that fetched for itself could catch
      # a run that finished in between and deal other piles than its
      # neighbours, and then a file runs twice or not at all.
      #
      # Each OS from the last run that left its shards' records, whatever
      # its event: a master push a pull request already passed stands down
      # (above), so nearly every run that tests is a bundle PR's. ⛔Nothing
      # here fails the run: no record, an API that does not answer, an
      # expired artifact — each leaves the OS's file empty, and its shards
      # deal by size as they did before records.
      - if: steps.again.outputs.again != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out="$RUNNER_TEMP/shard-times"
          mkdir -p "$out"
          for os in Linux Windows; do
            : > "$out/$os.tsv"
            run=$(gh api \
              "repos/${{ github.repository }}/actions/artifacts?name=test-times-$os-0&per_page=10" \
              --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty' \
              2>/dev/null)
            if [ -z "$run" ]; then
              echo "$os: no run left a record — its shards deal by size"
              continue
            fi
            got="$RUNNER_TEMP/got-$os"
            gh run download "$run" -R "${{ github.repository }}" \
              -p "test-times-$os-*" -D "$got" \
              || echo "$os: run $run's records could not be fetched"
            find "$got" -name test_times.tsv -exec cat {} + 2>/dev/null \
              | LC_ALL=C sort > "$out/$os.tsv"
            echo "$os: $(wc -l < "$out/$os.tsv") files timed by run $run"
          done
      - if: steps.again.outputs.again != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: shard-times
          path: ${{ runner.temp }}/shard-times/
          retention-days: 1
          overwrite: true

  # ↩️A job stood here that compiled the C core with gcc and clang on
  # Linux — a third compiler on a different OS, the fastest way to catch
  # portability breakage before the platform builds got involved — till
  # the C went (2026-11-13). The Rust engine is built by every job that
  # runs a test, and its own tests run on three hosts (gpu-engine.yml).
  #
  # Every job below carries a timeout-minutes, and the reason is that
  # GitHub's default is 360. On 2026-08-15 one Windows shard stopped
  # inside `flutter test` and sat there: eleven of twelve jobs were green
  # in under eight minutes, queue was four seconds, and the run had been
  # open for half an hour with nothing to show — a hang has no signal of
  # its own, it just looks like slowness that never ends. Left alone it
  # would have held the check for six hours and produced no log, because
  # the log blob only appears once the job finishes.
  #
  # The numbers are 2-3x the measured maximum over the last 15 runs, so a
  # slow-but-real job is never killed: Windows shards peak at 10.2 min
  # (89 samples), Linux shards 5.9, Windows app build 4.7, Android 3.8,
  # native C 0.9. The hang was at 31 minutes and climbing when it was
  # noticed, which is what makes the boundary easy — a stuck job is not
  # near the healthy range, it is several times past it.
  #
  # Re-measured 2026-10-22, after the Linux shards went from many to three
  # and the suite kept growing: the healthy Linux shards ran 9-14 min on
  # 10-03, 13-18 on 10-08, 15-19 on 10-15 and 17-19 on 10-22, and since
  # 10-15 ten of the eighteen shards that ran were killed at the 20-minute
  # deadline while still passing tests — the real job this rule exists not
  # to kill. So the Linux shards' deadline is 45: just over 2x the 20-21
  # minutes a shard now takes, the same rule as before with today's numbers.
  #
  # Re-measured 2026-11-17 (card ci-linux-shards-cannot-make-a-shown-surface),
  # after the canvas went to the GPU engine (11-09) and these shards drew it
  # on lavapipe — on the CPU: the shards were 26-29 min on 11-06 (run
  # 42274839761) and every run of the bundle PR since has been killed at 45
  # while still passing tests. Run 43891668921: shard 2's first pass took
  # 41.7 min to the end, and shards 0 and 1 were cut at 44 min with 78% and
  # 93% of a shard's tests behind them — 56 and 47 min to the end of the
  # pass, about 59 for the slowest job. The files that grew most are the
  # ones that open the workspace and draw it (the top strip's widths 24 s →
  # 436 s, a float on a keyed row 75 → 467 s). So the deadline is 120: just
  # over 2x the slowest, the same rule again.

  # Sharded by FILE LIST, and the distinction is the whole point.
  #
  # Measured on run 31582250482: of this job's 752s test step, only 609
  # slot-seconds are tests actually executing — the other 836 are per-file
  # kernel compile and `flutter_tester` spawn, paid 728 times at 1.17s each
  # (on Windows, 3.08s each). So the way to make the suite faster is to
  # hand each runner FEWER FILES, not fewer tests.
  #
  # `flutter test --total-shards` does NOT do that: test_core's _shardSuite
  # filters an already-LOADED suite by test index, so every shard still
  # compiles and spawns all 728 files. Measured, it saturates at 1.20x no
  # matter how many shards you buy (N=2 24m59s, N=8 23m05s, N=12 22m52s).
  # Splitting the file list divides load AND work: a 1-in-8 file list ran
  # at 0.142x of the full suite, 88% of linear. Do not "simplify" this back
  # into --total-shards.
  #
  # Coverage is unchanged: the selector partitions the file list, so every
  # file runs in exactly one shard, and the step fails if a shard selects
  # nothing. It packs by weight rather than dealing round-robin — the
  # reasoning is in .github/actions/test-shard/action.yml, next to the code
  # that does it.
  analyze-and-test:
    name: analyze + full test suite (shard ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.again != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Without this one red shard hides the others, and the point of
      # splitting is to learn everything each run has to tell us.
      fail-fast: false
      # ↩️Three, while the job COUNT was the thing that cost — see the note
      # above the windows job. Six from 2026-11-17 (ci-takes-an-hour-on-
      # lavapipe): since the canvas went to the GPU engine (11-09) these
      # shards draw it on the CPU and decide the run alone — 51.9, 56.1 and
      # about 40 minutes of tests on 11-17, the Windows shards 11-15. The
      # run is one bundle PR now, not five runs in flight (the 08-12
      # saturation), and six makes it fifteen jobs against the limit of
      # twenty. ⚠️The 120 above is still the three shards' rule — measure
      # six on the next run and set it again.
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Build hooks (pdfium_dart, sqlite3) download prebuilt binaries from
      # GitHub releases during ANY flutter build/test; both short-circuit
      # when their shared output already exists, so caching it makes a
      # releases outage a once-per-lockfile risk instead of an every-run
      # one.
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      # The packages the app does not depend on, which analyze still reads
      # — why, and the list, are in the script (gpu-engine-skeleton-Q2).
      - if: matrix.shard == 0
        run: bash tool/resolve_packages.sh .
      # Once, not once per shard — it reads the whole package either way.
      # Kept INSIDE the matrix rather than split into its own job so that
      # deleting the guard can only make it run three times (noisy), never
      # zero (silent). 26s on one shard is the price of that asymmetry.
      - if: matrix.shard == 0
        run: flutter analyze
      # ↩️The C engine was built here, so the parity suites between it and
      # its Dart reference ran instead of skipping — #614 is the standing
      # lesson about what an unexercised parity suite is worth: it stayed
      # green for five rounds while Apple silicon rendered different pixels
      # — till the C went (2026-11-13). Nothing here can skip for want of
      # an engine now: the one the tests open is built by this run.
      # The GPU engine the tests open (packages/gpu_engine, built by the
      # app's build hook) needs an adapter, and this runner has no GPU:
      # lavapipe, Mesa's Vulkan on the CPU, which gpu-engine.yml's Linux
      # job runs the engine's own tests on. Every test that reaches the
      # engine runs here — the Windows shards leave them to these six
      # (유저 gpu-engine-skeleton-Q16, below).
      # (Readied by the action, with why it lends /dev/udmabuf and raises its
      # limit on one buffer.)
      - uses: ./.github/actions/lavapipe
      # From the engine build master's engine-target job kept, rather than
      # cold (the action says how the key chooses).
      - uses: ./.github/actions/rust-engine
        with:
          target: restore
      # The project's green rule: the exit code decides, never the tail.
      - name: Run tests against the engine this run built
        uses: ./.github/actions/test-shard
        with:
          total: 6
          index: ${{ matrix.shard }}
          times-artifact: shard-times

  # 🦀THE ENGINE BUILD THE LINUX SHARDS START FROM (card
  # ci-shards-build-the-engine-cold, 2026-11-17). A pull request's cache is
  # its own, so only a master push can leave one every later run reads —
  # and since a tested tree stands the master run down (scope's `again`),
  # this job runs on every master push the app changed in, whatever
  # `again` says. It builds the engine the way a shard does, through the
  # app's build hook under a test run — one file that opens nothing, since
  # the hook builds for any test, run by the plan as every run here is
  # (a_file_that_needs_impeller_runs_apart_test) — and the action keeps the
  # folder when the engine's files are new. The same files as a kept build
  # find the library among its copies and keep nothing new.
  engine-target:
    name: keep the engine build (Linux)
    needs: scope
    if: github.event_name == 'push' && needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - uses: ./.github/actions/rust-engine
        with:
          target: keep
      - run: |
          echo test/architecture/the_shards_weigh_files_that_are_there_test.dart \
            > "$RUNNER_TEMP/engine_target_tests.txt"
          dart tool/affected_tests.dart \
            --files-from "$RUNNER_TEMP/engine_target_tests.txt" \
            --outside-the-line --concurrency 1

  android:
    name: Android build
    needs: scope
    if: needs.scope.outputs.app == 'true' && needs.scope.outputs.again != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Gradle re-resolved every dependency on every run; setup-java already
      # knows how to keep them, so this is one line rather than a hand-rolled
      # cache step with a key to get wrong.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-android-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - uses: ./.github/actions/rust-engine
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

  # The app the user actually runs every day, compiled the way it ships:
  # runner + plugin registrants + native linking. flutter test can't see any
  # of that — a method-channel plugin missing from generated_plugins.cmake
  # passes the whole suite and then fails on the user's desk. This job is
  # the observability that native-dependency changes (pdfrx and friends)
  # were blocked on.
  windows-app:
    name: Windows app build
    needs: scope
    if: needs.scope.outputs.app == 'true' && needs.scope.outputs.again != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - uses: ./.github/actions/rust-engine
      - run: flutter build windows --debug

  # The critical path, and the reason this file was restructured: measured
  # at 27m34s against every other job finishing by 13m44s. Windows is NOT
  # slower at running tests (508s of in-file execution against Linux's 527s)
  # — it is 2.6x slower at loading them, 3.08s per file against 1.17s, and
  # it pays that 728 times.
  #
  # Six, and the number came down rather than up, because shards stopped
  # being free.
  #
  # Eight was right for a repository where one pull request runs at a time.
  # This one had five CI runs in flight at once — several branches plus
  # master — and at sixteen jobs a run that is eighty jobs against a
  # twenty-job concurrency limit. Measured on 2026-08-12: the same suite
  # that finished in 7m21s alone took 18m44s in that traffic, and the whole
  # difference was queue — 259 to 377 seconds of it per job, against a p50
  # of 3 seconds when nothing else was running.
  #
  # Under saturation the arithmetic inverts. Throughput is pinned at twenty
  # slots, so sharding no longer divides the work, it ADDS to it: every
  # extra Windows job pays ~110s of setup it did not have to. Eight shards
  # is 880 runner-seconds of `subosito/flutter-action` per run before a
  # single test runs.
  #
  # Six rather than five, which is what the eye would pick: at five, a
  # shard's file list is 6751 characters and xargs splits it in two, so the
  # job pays the resident compiler's cold start twice — the exact cost that
  # was just taken off the Linux jobs. Measured on the live tree: N=4 8420
  # chars, N=5 6751, N=6 5699, N=8 4248. Six is the smallest that still
  # fits one batch, and it is the floor for that reason and no other.
  windows:
    name: Windows + native DLL (shard ${{ matrix.shard }})
    # ⚠️These run the suite on Windows, beside the engine's library as
    # this runner builds it (↩️and against the C engine's DLL, the parity
    # watch the job is named for, till the C went — 2026-11-13). Board
    # tests are pure Dart and are covered by the Linux shards either way.
    needs: scope
    if: needs.scope.outputs.app == 'true' && needs.scope.outputs.again != 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      # The app's build hook builds the GPU engine for every `flutter test`,
      # whether a file here opens it or not.
      - uses: ./.github/actions/rust-engine
      - name: Run tests with the engine on PATH
        uses: ./.github/actions/test-shard
        with:
          total: 6
          index: ${{ matrix.shard }}
          times-artifact: shard-times
          # 🗣️유저 gpu-engine-skeleton-Q16 (2026-11-07) 「윈도 샤드는 엔진에
          # 닿는 시험을 리눅스에 맡긴다」: this runner has no GPU, and the one
          # adapter the GPU engine opens on it, WARP, never finishes the
          # engine's optimised shaders — blend, composite, dab blur,
          # Gaussian, resample, warp; 15 minutes and still running on the
          # main PC's WARP — and with the optimisation off each process's
          # first compile is minutes and its first values wrong (WARP's).
          # So the tests that reach the engine — 1472 of 3116 files on the
          # day — run on the three Linux shards above, on lavapipe, and CI
          # never draws through the engine on Windows: its DX12 kernels are
          # the land gate's crate tests on the main PC's RTX, and the screen
          # is the PCs'. ⛔Running them here again is not a fix but a new
          # question for the user.
          leave-out-package: gpu_engine
      # A step that stood past its limit leaves the process's threads in
      # build/native_call_watch before the run ends
      # (test/helpers/native_call_watch.dart) — kept from a red shard.
      - name: Keep a stuck run's dump
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: native-call-watch-shard-${{ matrix.shard }}
          path: build/native_call_watch/
          if-no-files-found: ignore
          retention-days: 7
