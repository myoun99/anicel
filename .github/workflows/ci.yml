name: CI

# The cheap tier: analyze, the full test suite, and a portability check on
# the native C core. PRs run against the virtual merge with master; pushes
# to master verify the merged result. Branch pushes alone don't trigger —
# every branch goes through a PR anyway, and running both events doubled
# every run for nothing (workflow_dispatch covers the rare PR-less case).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A PR keeps ONE group, so pushing a fix supersedes the run it replaces —
# that is the behaviour worth keeping. A master push must NOT: consecutive
# merges land minutes apart and shared a single group, so each new merge
# killed the previous one's run. Measured on 2026-08-12: 11 of 21 master
# pushes were cancelled that way, burning 364 runner-minutes and leaving
# master with a completed verdict on only 9 of 21 commits. Giving pushes a
# per-commit group lets every merged commit finish and say something.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  # 🚨★★★DOES THIS CHANGE TOUCH THE APP AT ALL?
  #
  # 유저 2026-08-31: 「무슨 보드는 내 컴퓨터에서만 하는데 안드로이드 빌드
  # 네이티브c 이딴게 왜필요한거야?」 — it does not. `tool/board_*.dart` is a
  # dev script that runs on one machine and ships in nothing; a one-file edit
  # to it was buying an Android build, a Windows app build, a native C
  # portability check and six Windows shards. Twelve checks for a page nobody
  # else ever loads.
  #
  # ⚠️`analyze + full test suite` STILL RUNS, always. It is the merge gate
  # (`flutter analyze` with no arguments) and it runs the 105 board tests. The
  # jobs that stand down are the ones whose whole question is 「does the APP
  # still compile and link」, which a board edit cannot affect.
  #
  # ⛔FAIL-SAFE: anything this cannot work out means `app=true`. A shallow
  # clone, a force-push, a workflow_dispatch with no diff to read — every one
  # of those runs everything, because the cost of a needless build is minutes
  # and the cost of a skipped one is a broken master.
  #
  # ⚠️Job-level `if`, not a workflow-level `paths:` filter. A filtered-out
  # workflow reports NO check at all, and 「체크 0개」 is not green, it is
  # unverified — `merge_check.sh` counts checks and would have to learn a
  # second meaning for zero. A skipped JOB still posts its check.
  scope:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.what.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: what
        shell: bash
        run: |
          app=true
          base=""
          head="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          fi
          if git cat-file -e "$base^{commit}" 2>/dev/null \
            && git cat-file -e "$head^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$base" "$head" || true)
            if [ -n "$files" ]; then
              # Everything outside the board's own files makes it an app change.
              if ! printf '%s\n' "$files" \
                | grep -qvE '^(tool/board_[a-z_]+\.dart|test/tool/)'; then
                app=false
              fi
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "app=$app  (${files:-<no diff read>})"

  # The C core compiled by a THIRD compiler (gcc) on a different OS —
  # the fastest way to catch portability breakage before the platform
  # builds get involved. Two minutes, every push.
  # Every job below carries a timeout-minutes, and the reason is that
  # GitHub's default is 360. On 2026-08-15 one Windows shard stopped
  # inside `flutter test` and sat there: eleven of twelve jobs were green
  # in under eight minutes, queue was four seconds, and the run had been
  # open for half an hour with nothing to show — a hang has no signal of
  # its own, it just looks like slowness that never ends. Left alone it
  # would have held the check for six hours and produced no log, because
  # the log blob only appears once the job finishes.
  #
  # The numbers are 2-3x the measured maximum over the last 15 runs, so a
  # slow-but-real job is never killed: Windows shards peak at 10.2 min
  # (89 samples), Linux shards 5.9, Windows app build 4.7, Android 3.8,
  # native C 0.9. The hang was at 31 minutes and climbing when it was
  # noticed, which is what makes the boundary easy — a stuck job is not
  # near the healthy range, it is several times past it.
  native-portability:
    name: native C (gcc + clang)
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build with gcc
        run: |
          cmake -S packages/qa_native/src -B build/ci-gcc -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build/ci-gcc --config Release
      - name: Build with clang (stricter warnings)
        run: |
          cmake -S packages/qa_native/src -B build/ci-clang -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang
          cmake --build build/ci-clang --config Release
      # 🚨★★★**THE FIRST NATIVE CODE THIS REPO EVER RAN IN CI.** This job
      # built the library twice and then printed `ls -la` — 「it compiles on
      # two compilers」 is a real answer to a real question, and it was the
      # ONLY question being asked. Both, because the point of two compilers
      # is that they can disagree, and that goes for behaviour too.
      #
      # ⚠️If this ever says 「No tests were found」, that is a FAILURE wearing
      # a success: `--output-on-failure` prints nothing when nothing ran, and
      # a job that runs no tests looks exactly like a job that passes them.
      - name: Run the native law tests (gcc)
        run: ctest --test-dir build/ci-gcc --output-on-failure --no-tests=error
      - name: Run the native law tests (clang)
        run: ctest --test-dir build/ci-clang --output-on-failure --no-tests=error
      - name: Show artifacts
        run: ls -la build/ci-gcc build/ci-clang

  # Sharded by FILE LIST, and the distinction is the whole point.
  #
  # Measured on run 31582250482: of this job's 752s test step, only 609
  # slot-seconds are tests actually executing — the other 836 are per-file
  # kernel compile and `flutter_tester` spawn, paid 728 times at 1.17s each
  # (on Windows, 3.08s each). So the way to make the suite faster is to
  # hand each runner FEWER FILES, not fewer tests.
  #
  # `flutter test --total-shards` does NOT do that: test_core's _shardSuite
  # filters an already-LOADED suite by test index, so every shard still
  # compiles and spawns all 728 files. Measured, it saturates at 1.20x no
  # matter how many shards you buy (N=2 24m59s, N=8 23m05s, N=12 22m52s).
  # Splitting the file list divides load AND work: a 1-in-8 file list ran
  # at 0.142x of the full suite, 88% of linear. Do not "simplify" this back
  # into --total-shards.
  #
  # Coverage is unchanged: the selector partitions the file list, so every
  # file runs in exactly one shard, and the step fails if a shard selects
  # nothing. It packs by weight rather than dealing round-robin — the
  # reasoning is in .github/actions/test-shard/action.yml, next to the code
  # that does it.
  analyze-and-test:
    name: analyze + full test suite (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Without this one red shard hides the others, and the point of
      # splitting is to learn everything each run has to tell us.
      fail-fast: false
      # Three, because the job COUNT is now the thing that costs — see the
      # note above the windows job. Linux shards are the cheap ones (33s of
      # setup against Windows' 110s), so they are also the ones it costs
      # least to give up.
      matrix:
        shard: [0, 1, 2]
    # Job-wide rather than on the test step: the step is a composite action
    # now, and an env that has to travel through one is an env that can go
    # missing. QA_REQUIRE_NATIVE turns "engine not found" from a skip into
    # a failure, which is the only reason a parity suite means anything.
    env:
      QA_ENGINE_PATH: ${{ github.workspace }}/build/native_standalone/libqa_engine.so
      QA_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Build hooks (pdfium_dart, sqlite3) download prebuilt binaries from
      # GitHub releases during ANY flutter build/test; both short-circuit
      # when their shared output already exists, so caching it makes a
      # releases outage a once-per-lockfile risk instead of an every-run
      # one.
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      # Once, not once per shard — it reads the whole package either way.
      # Kept INSIDE the matrix rather than split into its own job so that
      # deleting the guard can only make it run three times (noisy), never
      # zero (silent). 26s on one shard is the price of that asymmetry.
      - if: matrix.shard == 0
        run: flutter analyze
      # The parity suites resolve a locally built engine or SKIP. This job
      # used to run without one — the gcc build lives in a different job on
      # a different runner, so its artifacts were never here — which meant
      # every byte-parity pin quietly skipped on Linux. gcc on x86_64 is a
      # genuinely distinct third compiler from MSVC and Apple clang, and
      # #614 is the standing lesson about what an unexercised parity suite
      # is worth: it stayed green for five rounds while Apple silicon
      # rendered different pixels.
      - uses: ./.github/actions/native-engine
      # The project's green rule: the exit code decides, never the tail.
      - name: Run tests against the gcc-built engine
        uses: ./.github/actions/test-shard
        with:
          total: 3
          index: ${{ matrix.shard }}

  android:
    name: Android build
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Gradle re-resolved every dependency on every run; setup-java already
      # knows how to keep them, so this is one line rather than a hand-rolled
      # cache step with a key to get wrong.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-android-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

  # The app the user actually runs every day, compiled the way it ships:
  # runner + plugin registrants + native linking. flutter test can't see any
  # of that — a method-channel plugin missing from generated_plugins.cmake
  # passes the whole suite and then fails on the user's desk. This job is
  # the observability that native-dependency changes (pdfrx and friends)
  # were blocked on.
  windows-app:
    name: Windows app build
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - run: flutter build windows --debug

  # The critical path, and the reason this file was restructured: measured
  # at 27m34s against every other job finishing by 13m44s. Windows is NOT
  # slower at running tests (508s of in-file execution against Linux's 527s)
  # — it is 2.6x slower at loading them, 3.08s per file against 1.17s, and
  # it pays that 728 times.
  #
  # Six, and the number came down rather than up, because shards stopped
  # being free.
  #
  # Eight was right for a repository where one pull request runs at a time.
  # This one had five CI runs in flight at once — several branches plus
  # master — and at sixteen jobs a run that is eighty jobs against a
  # twenty-job concurrency limit. Measured on 2026-08-12: the same suite
  # that finished in 7m21s alone took 18m44s in that traffic, and the whole
  # difference was queue — 259 to 377 seconds of it per job, against a p50
  # of 3 seconds when nothing else was running.
  #
  # Under saturation the arithmetic inverts. Throughput is pinned at twenty
  # slots, so sharding no longer divides the work, it ADDS to it: every
  # extra Windows job pays ~110s of setup it did not have to. Eight shards
  # is 880 runner-seconds of `subosito/flutter-action` per run before a
  # single test runs.
  #
  # Six rather than five, which is what the eye would pick: at five, a
  # shard's file list is 6751 characters and xargs splits it in two, so the
  # job pays the resident compiler's cold start twice — the exact cost that
  # was just taken off the Linux jobs. Measured on the live tree: N=4 8420
  # chars, N=5 6751, N=6 5699, N=8 4248. Six is the smallest that still
  # fits one batch, and it is the floor for that reason and no other.
  windows:
    name: Windows + native DLL (shard ${{ matrix.shard }})
    # ⚠️These run the suite against the NATIVE DLL — the parity watch. Board
    # tests are pure Dart and are covered by the Linux shards either way.
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      QA_ENGINE_PATH: build/native_standalone/Release/qa_engine.dll
      QA_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      # The engine DLL the parity tests need; without it those tests skip
      # loudly rather than fail, so building it here is what actually
      # exercises the C implementation against the Dart reference.
      - uses: ./.github/actions/native-engine
      - name: Run tests with the engine on PATH
        uses: ./.github/actions/test-shard
        with:
          total: 6
          index: ${{ matrix.shard }}
