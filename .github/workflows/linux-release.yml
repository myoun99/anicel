# 🐧THE LINUX BUILD ANYONE ELSE CAN OPEN — a release bundle, launched once on
# a virtual screen, tarred.
#
# 유저 2026-10-02 (board, linux-target-Q1): 「회차마다 리눅스 빌드도 rel 에」 —
# every release round hands out a Linux build beside the Mac zip, the Windows
# zip and the Play bundle, and it wears the round's TestFlight number like they do.
# Linux has been a target since 2026-07-19, but until this file nothing had
# ever compiled the APP for it: CI builds and tests the C engine on Ubuntu,
# never `flutter build linux`.
#
# ⛔NO SCHEDULE AND NO PUSH TRIGGER, for the reason at the head of
# `macos-developer-id.yml`: 132 runs in a day got the account suspended
# (2026-08-31). One run per release round, asked for by hand.
#
# ⚠️NOBODY HERE OWNS A LINUX MACHINE (유저 2026-08-29: 「나 리눅스없는데
# 가능한가」). This file proves the bundle builds, that the engine draws the
# bytes every other platform draws, and that the bundle opens its window.
# Whether a pen's pressure arrives, or a real GPU keeps up, nobody has seen.
name: Linux (release bundle)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: The build number to stamp — the release round's TestFlight number.
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  # The release path's check of the engine, as TestFlight and the Mac build
  # run it: the tests that call into the engine's library
  # (tool/native_parity_tests.sh). The library they open is the one this
  # job's build hook builds for them — never the bundle's: the tests open
  # what the hook leaves for a test run, the bundle holds what ships.
  # ↩️Till 2026-11-13 it was the C engine's parity check, against the engine
  # the bundle SHIPPED: the plugin build left a standalone .so, made by
  # Flutter's clang rather than the gcc build the CI shards tested; the pins
  # took it where its build left it — not the bundle's copy, which holds
  # only what ships (run 41038440055) — once `cmp` showed it was the
  # bundle's own bytes, so the file handed out was the file checked; and
  # QA_REQUIRE_NATIVE made a missing engine fail rather than skip. The C
  # went, and its .so with it.
  # ↩️A JOB OF ITS OWN, NOT A STEP OF THE BUNDLE'S (2026-11-16). On the
  # bundle's 22.04 runner every one of these tests was `Bad state: no
  # adapter` (round 1091, run 43724312633): it has no Vulkan. Lavapipe
  # shows the engine's surfaces only through a dma-buf export that has been
  # seen working on Mesa 25.2.8 and 26.0.8 (gpu-engine.yml's 24.04 job,
  # ci.yml's ubuntu-latest shards) — 22.04's is 23.2.1, never tried. So the
  # tests run where ci.yml's run the same tests, readied the same way; the
  # bundle still compiles on 22.04 for the reason beside it, and waits for
  # this job, so a red engine hands nothing out, as when this was its step.
  engine:
    name: Tests on the engine (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: ./.github/actions/lavapipe
      - uses: ./.github/actions/rust-engine
      - name: Tests on the engine as this runner builds it
        run: |
          set -euo pipefail
          bash tool/native_parity_tests.sh > "$RUNNER_TEMP/parity.txt"
          echo "engine subset: $(wc -l < "$RUNNER_TEMP/parity.txt") of $(find test -name '*_test.dart' | wc -l) files"
          # Run as every workflow runs a list: by the plan, on the runner as
          # the one job it holds, at half its cores (tool/runner_tests.sh).
          bash tool/runner_tests.sh "$RUNNER_TEMP/parity.txt"

  bundle:
    name: Linux bundle
    needs: engine
    # 🚨22.04, NOT ubuntu-latest. The runner, the plugins and the engine are
    # compiled HERE, and a binary asks for the newest symbol versions of the
    # glibc and libstdc++ it was linked against — so the runner's are the
    # floor of every desk the bundle opens on. 22.04 (glibc 2.35) still
    # opens on 22.04 and Debian 12; a 24.04 build (2.39) would not. CI's
    # test shards stay on ubuntu-latest: they hand nothing out.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter's own list for a Linux desktop build, and for the launch
      # below a virtual screen, Mesa's software GL and a way to find a
      # window by its title.
      #
      # ↩️GStreamer stood here for audioplayers_linux, and went with it
      # (2026-10-23). ⚠️If it comes back, name libunwind-dev with it: the
      # 22.04 runner image ships LLVM's libunwind-14-dev, which conflicts
      # with the libunwind-dev that libgstreamer1.0-dev depends on; left to
      # pull it in as a dependency apt refuses the whole install ("you have
      # held broken packages" — the first run, 2026-10-04). Asked for by
      # name, apt swaps the two.
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            xvfb xdotool libgl1-mesa-dri
      - run: flutter pub get
      - uses: ./.github/actions/rust-engine

      # 🔢One number per round, the round's TestFlight number (유저
      # 2026-10-02: 「제일 높은 테스트플라이트 숫자로 통일」). Required here,
      # unlike the Mac's input: Linux has no numbering of its own to fall
      # back to. Read through env, never pasted into the script.
      # tool/release_build.sh refuses one that is not digits, and stamps the
      # number and the commit the feedback forms read (I-139-Q5).
      - name: Build Flutter Linux
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          bash tool/release_build.sh linux "$BUILD_NUMBER"

      # The launch the Windows zip gets on the desk: still alive after 15 s,
      # with its window titled Anicel. Xvfb is the screen and Mesa's llvmpipe
      # the GPU. It proves every library resolves and the runner makes its
      # window — nothing about a pen, a real GPU or a speed.
      - name: Launch on a virtual screen
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          screen=$!
          sleep 2
          DISPLAY=:99 build/linux/x64/release/bundle/anicel > "$RUNNER_TEMP/launch.log" 2>&1 &
          app=$!
          sleep 15
          alive=no
          if kill -0 "$app" 2>/dev/null; then alive=yes; fi
          window=$(DISPLAY=:99 xdotool search --name '^Anicel$' 2>/dev/null | head -n 1) || true
          kill "$app" "$screen" 2>/dev/null || true
          cat "$RUNNER_TEMP/launch.log"
          if [ "$alive" != yes ]; then
            echo "::error::the app was gone within 15 s"
            exit 1
          fi
          if [ -z "$window" ]; then
            echo "::error::no window titled Anicel"
            exit 1
          fi

      # A tarball, because the artifact store zips whatever it is given and
      # a zip drops the executable bit — the bundle would not start from it.
      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          cp -a build/linux/x64/release/bundle "$RUNNER_TEMP/pkg/Anicel"
          tar -C "$RUNNER_TEMP/pkg" -czf "$RUNNER_TEMP/Anicel-linux.tar.gz" Anicel

      # 90 days is the ceiling a public repository gets, as for the Mac zip.
      - name: Upload the Linux bundle
        uses: actions/upload-artifact@v5
        with:
          name: anicel-linux
          path: ${{ runner.temp }}/Anicel-linux.tar.gz
          if-no-files-found: error
          retention-days: 90
