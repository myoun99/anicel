# 🪟THE WINDOWS BUILD FOR ARM PCs — a release bundle, the engine's tests
# that draw nothing run on this CPU, launched once, zipped.
#
# 유저 2026-10-30 (board, windows-arm64-build): 「일단 arm64가 지금 없으니까
# 이거 빌드에넣고싶」 — Windows on ARM has been a target since 2026-07-07, and
# nothing had ever compiled the app for it. It cannot be built on the desk:
# Flutter builds Windows for the CPU it runs on, and both PCs here are x64.
#
# ⛔NO SCHEDULE AND NO PUSH TRIGGER, for the reason at the head of
# `macos-developer-id.yml`: 132 runs in a day got the account suspended
# (2026-08-31). One run per release round, asked for by hand.
#
# ⚠️NOBODY HERE OWNS AN ARM PC. This file proves the bundle builds, that every
# binary in it is ARM64, that the tests which call into the engine's library
# and reach no GPU pass on this CPU's build of it (↩️the C engine's byte
# parity with every other platform, till the C went — 2026-11-13), and that
# it opens its window on this runner. Whether a pen's pressure arrives, or
# the engine draws on an ARM PC's GPU at all, nobody has seen: this runner
# has none (the device step below).
# ↩️Till 2026-11-08 it proved that a .wasm plugin answered as its native
# twin did; the fx host is the Rust engine's since, and its WebAssembly
# tests are its crate's, run on this CPU by hand (gpu-engine.yml).
name: Windows ARM64 (release bundle)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: The build number to stamp — the release round's TestFlight number.
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  bundle:
    name: Windows ARM64 bundle
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # 🚨NOT subosito/flutter-action. Flutter's only Windows archive is x64
      # (no release in releases_windows.json says arm64), and the tool builds
      # for the CPU its own Dart runs on — so under the emulator the whole
      # job would stay green and hand out another x64 build. A checkout of
      # the tag fetches its Dart for this machine instead, as long as the
      # first run is a native process: PowerShell here, not bash, which may
      # be x64 itself.
      - name: Flutter for this CPU
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:FLUTTER_VERSION" https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          $bin = "$env:RUNNER_TEMP\flutter\bin"
          & "$bin\flutter.bat" --version
          $dart = & "$bin\dart.bat" --version
          if ($dart -notmatch 'windows_arm64') {
            Write-Output "::error::Dart is not native here: $dart"
            exit 1
          }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: flutter pub get
      - uses: ./.github/actions/rust-engine

      # 🔢One number per round, read through env and never pasted into the
      # script, as linux-release.yml does.
      - name: Build Flutter Windows
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          bash tool/release_build.sh windows "$BUILD_NUMBER"

      # What a build hook said, when the build failed: Flutter's build
      # prints only that a hook failed (`Building native assets failed. See
      # the logs for more details.`) and keeps the hook's own words beside
      # its input — round 1091's ARM64 build stopped there with no cause on
      # screen (run 43724334174), the first build of the GPU engine's hook
      # on this runner since the app began to ship it (2026-11-07).
      - name: The build hooks' logs
        if: failure()
        run: |
          shown=0
          for log in .dart_tool/hooks_runner/*/*/stdout.txt .dart_tool/hooks_runner/*/*/stderr.txt; do
            [ -s "$log" ] || continue
            echo "::group::$log"
            tail -n 300 "$log"
            echo "::endgroup::"
            shown=$((shown + 1))
          done
          echo "$shown hook log(s) under .dart_tool/hooks_runner"

      - name: The bundle's own check
        run: bash tool/windows_bundle_check.sh build/windows/arm64/runner/Release

      # One x64 library is enough to stop the app, and only on an ARM PC: a
      # prebuilt fetched by a package's build hook comes as the hook chose.
      - name: Every binary is ARM64
        shell: pwsh
        run: |
          $wrong = Get-ChildItem build\windows\arm64\runner\Release -Recurse -Include *.exe, *.dll | Where-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $header = [BitConverter]::ToInt32($bytes, 0x3C)
            [BitConverter]::ToUInt16($bytes, $header + 4) -ne 0xAA64
          }
          if ($wrong) {
            Write-Output "::error::not ARM64: $($wrong.Name -join ', ')"
            exit 1
          }

      # The release path's check of the engine, as the Linux build runs it:
      # the tests that call into the engine's library, on this runner's
      # build of it — LESS EVERY ONE THAT REACHES THE GPU ENGINE, left out
      # as the Windows shards leave them, by the one answer to which those
      # are (tool/tests_reaching_package.dart). What is left calls the
      # library's CPU work — the cel codec, the sound, the pen, the window —
      # as built for ARM64 Windows, which nothing else here runs.
      # 🗣️유저 gpu-engine-skeleton-Q16 (2026-11-07) 「윈도 샤드는 엔진에 닿는
      # 시험을 리눅스에 맡긴다」 and Q9 「ARM 은 빌드와 CPU 크레이트 시험만 —
      # 다른 잡 급으로」: a Windows runner has no GPU, and WARP, the device
      # the engine opens on it, never finishes the engine's optimised
      # shaders. This runner is one — the device step names `Microsoft
      # Basic Render Driver` (rounds 1094 and 1095, runs 44754428408 and
      # 44807382647). From 2026-11-13 this step ran them all the same: the
      # C's parity list became the tests that name `src/native/`, which open
      # the Rust GPU engine, and no round got past it — 1091 and 1093 ran
      # out of the hour, and in 1095 its 290 files waited past 30 s 129
      # times, one process committed 8.1 GB, and the 28 red files all
      # reached the GPU engine (card
      # the-windows-arm64-build-stops-at-its-engine-tests, 2026-11-21).
      # The cost, as Q9 took it: no test on this road draws on ARM64
      # Windows, and every Dart test of the premultiplied copy's NEON step
      # reaches the GPU engine too — the step is held on this CPU by its
      # crate's own tests, by hand (gpu-engine.yml), and a real ARM PC is
      # the first to draw. ⛔Running them here again is not a fix but a new
      # question for the user.
      # ↩️That was the C host's own test, run here, until 2026-11-08. And
      # till 2026-11-13 the step was the C engine's parity check — MSVC on
      # ARM64, a compiler nothing else here ran — on the engine read in the
      # build folder, which `cmp` held to the file the bundle shipped, with
      # QA_REQUIRE_NATIVE so a missing engine failed rather than skipped.
      # 🧭Which device the engine opens here, said before its tests (card
      # windows-arm64-runner-engine-tests-stall-on-a-software-gpu,
      # 2026-11-18): rounds 1091 and 1093 stood past the job's hour on GPU
      # work past 30 s and an 8 GB commit, and no log named the device. A
      # step of its own, so the name is in the log even when the tests
      # after it run out of time.
      - name: The device the engine opens
        run: |
          set -euo pipefail
          echo test/native/the_engine_names_the_device_it_opened_test.dart \
            > "$RUNNER_TEMP/device.txt"
          dart tool/affected_tests.dart --files-from "$RUNNER_TEMP/device.txt"

      - name: Tests on the engine as this runner builds it
        run: |
          set -euo pipefail
          bash tool/native_parity_tests.sh > "$RUNNER_TEMP/engine.txt"
          dart tool/tests_reaching_package.dart gpu_engine \
            > "$RUNNER_TEMP/left_out.txt"
          # ⛔An empty list fails: grep selects nothing, and exits 1.
          grep -vxFf "$RUNNER_TEMP/left_out.txt" "$RUNNER_TEMP/engine.txt" \
            > "$RUNNER_TEMP/parity.txt"
          all=$(wc -l < "$RUNNER_TEMP/engine.txt")
          here=$(wc -l < "$RUNNER_TEMP/parity.txt")
          echo "engine subset: $here of the $all files that name src/native/ —" \
            "$((all - here)) reach package:gpu_engine, not run here"
          # Run by the run plan, as every list run goes: the pins that wait
          # for the collector alone and last (tool/affected_tests.dart).
          dart tool/affected_tests.dart --files-from "$RUNNER_TEMP/parity.txt"

      # The launch the x64 zip gets on the desk: still alive after 15 s, with
      # its window titled Anicel. It proves every library resolves and the
      # runner makes its window — nothing about a pen, a real GPU or a speed.
      - name: Launch
        shell: pwsh
        run: |
          $app = Start-Process build\windows\arm64\runner\Release\Anicel.exe -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) {
            Write-Output "::error::the app was gone within 15 s"
            exit 1
          }
          $title = $app.MainWindowTitle
          Stop-Process -Id $app.Id -Force
          if ($title -ne 'Anicel') {
            Write-Output "::error::no window titled Anicel, got '$title'"
            exit 1
          }

      # The folder as Anicel\, as the x64 zip holds it: the exe does not
      # start without the DLLs and data\ beside it.
      - name: Package
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\pkg"
          New-Item -ItemType Directory $pkg | Out-Null
          Copy-Item -Recurse build\windows\arm64\runner\Release "$pkg\Anicel"
          Push-Location $pkg
          & "$env:SystemRoot\System32\tar.exe" -a -cf "$env:RUNNER_TEMP\Anicel-windows-arm64.zip" Anicel
          Pop-Location

      # 90 days is the ceiling a public repository gets, as for the Mac zip.
      - name: Upload the Windows ARM64 bundle
        uses: actions/upload-artifact@v5
        with:
          name: anicel-windows-arm64
          path: ${{ runner.temp }}/Anicel-windows-arm64.zip
          if-no-files-found: error
          retention-days: 90
