name: Apple (macOS + iOS)

# The EXPENSIVE tier. macOS runners are free for this public repository,
# but a build is minutes rather than seconds - so this runs once a day
# and on demand, not on every push. Its job is COMPILE verification:
# nobody here owns a Mac, so "it builds and links on Apple platforms" is
# the guarantee this workflow buys.
on:
  schedule:
    # 03:00 UTC = 12:00 KST, once a day.
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    # Also whenever the native core or the Apple projects change - those
    # are exactly the edits this workflow exists to catch.
    paths:
      - 'packages/qa_native/**'
      - 'packages/**'
      - 'ios/**'
      - 'macos/**'
      - '.github/workflows/apple.yml'
      # A new plugin dependency changes CocoaPods/XCFramework linkage while
      # touching neither ios/ nor macos/ sources — without these two, that
      # breakage waits for the nightly to surface, and the nightly feeds
      # the TestFlight pipeline.
      - 'pubspec.yaml'
      - 'pubspec.lock'

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  apple:
    name: macOS app + iOS simulator + native C
    runs-on: macos-latest
    # Compile verification only — the suite lives in apple-suite below,
    # on the cadence where nobody waits on it. ~8 minutes warm; 20 bounds
    # a hang without ever touching a real run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Cheapest signal first: does the portable C core compile with
      # Apple clang for both host and iOS targets?
      - name: Native core (Apple clang, host)
        run: |
          cmake -S packages/qa_native/src -B build/ci-apple -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-apple --config Release
          ls -la build/ci-apple

      - name: Native core (arm64 iOS target)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -c packages/qa_native/src/qa_engine.c \
            -o /tmp/qa_engine_ios.o \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -O3 -ffp-contract=off -std=c99 -Wall
          # The decoder TU carries the AudioToolbox (AAC) path — compile it
          # for the DEVICE target too, not just the simulator pod build.
          xcrun --sdk iphoneos clang -c packages/qa_native/src/qa_audio_decode.c \
            -o /tmp/qa_audio_decode_ios.o \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -O3 -ffp-contract=off -std=c99
          # The denoise TU carries the vendored RNNoise bundle — device
          # target too, same as the decoder.
          xcrun --sdk iphoneos clang -c packages/qa_native/src/qa_audio_denoise.c \
            -o /tmp/qa_audio_denoise_ios.o \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -O3 -ffp-contract=off -std=c99
          ls -la /tmp/qa_engine_ios.o /tmp/qa_audio_decode_ios.o /tmp/qa_audio_denoise_ios.o

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # No signing needed for either of these: the macOS build is local,
      # and simulator builds never sign.
      - name: Build macOS app (debug)
        run: flutter build macos --debug

      - name: Build iOS for the simulator (no codesign)
        run: flutter build ios --debug --simulator --no-codesign

  # The BROAD half, on the cadence it was designed for. Until 2026-08-27
  # this ran as a step of the compile job above — which meant any PR
  # touching ios/ or macos/ waited ~27 minutes for a nightly-shaped
  # suite, because merge_check counts a PENDING check as a block (board
  # Q-apple-gate-time). The suite keeps its full breadth here; only the
  # push-triggered gate stopped waiting for it.
  #
  # ⛔Do not narrow this to the parity subset because testflight.yml runs
  # that subset on every build. The two are deliberately different
  # shapes: that one is NARROW and unskippable, this one is BROAD and
  # nightly. Narrowing here would leave macOS-only Dart defects — path
  # separators, file locking, Platform.isMacOS branches — with nothing
  # looking for them at all, and nobody is waiting on this job at 03:00
  # UTC.
  apple-suite:
    name: full suite on macOS (shard ${{ matrix.shard }})
    runs-on: macos-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # A shard is ~9 minutes of tests over ~4 of setup; 30 bounds a hang.
    timeout-minutes: 30
    strategy:
      # One red shard must not hide what the other two would have said.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      # The dylib built below, so the PARITY tests actually RUN here
      # instead of skipping. That is the real prize of a Mac runner: it
      # tells us whether Apple clang on arm64 produces the same bytes as
      # the Dart reference — fp contraction and NEON vectorization are
      # exactly the kind of thing that could diverge silently on a
      # platform nobody here owns. Platform-conditional code
      # (Platform.isMacOS branches in the input/sidecar layers) only
      # executes on this runner too.
      QA_ENGINE_PATH: ${{ github.workspace }}/build/ci-apple/libqa_engine.dylib
      # And QA_REQUIRE_NATIVE turns a MISSING engine into a failure
      # instead of a quiet skip. A skipped parity suite and a passing
      # one look identical in a CI summary, which is precisely how #614
      # hid for five rounds.
      QA_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v5
      # Same host build as the compile job — each shard rebuilds its own
      # dylib (~26s) rather than depending on an artifact hand-off.
      - name: Native core (Apple clang, host)
        run: |
          cmake -S packages/qa_native/src -B build/ci-apple -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-apple --config Release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Build hooks (pdfium_dart, sqlite3) download prebuilt binaries
      # during ANY flutter test; cached for the same reason as in ci.yml.
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - name: Run tests (engine loaded, parity tests live)
        uses: ./.github/actions/test-shard
        with:
          total: 3
          index: ${{ matrix.shard }}
