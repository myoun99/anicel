name: Ready the GPU engine's Rust
description: >
  The pinned compiler and its targets, the crates the engine is built from,
  and on Windows the pinned DXC — for a job whose Flutter build or test run
  builds packages/gpu_engine through its build hook (hook/build.dart), as
  every one does once the app depends on the engine — and the fx SDK's
  example, which the fx pin opens.

runs:
  using: composite
  steps:
    # rustup reads rust-toolchain.toml: the pinned compiler and every target
    # it lists, as on every machine that builds the engine. A step of its
    # own so the download shows as one, and fails as one, before the build
    # hook asks for it inside `flutter`.
    - shell: bash
      working-directory: packages/gpu_engine/rust
      run: rustup show
    # The crates.io downloads, every job of an OS alike: the whole lock is
    # 57 MB of .crate files (2026-11-07). ⛔Not the hook's target folder —
    # 492 MB a build (x64 Windows release, measured the same day) for each
    # OS and Android ABI, against 0.7 GB the repository's 10 GB of caches
    # had left: it would push the Flutter SDKs out, and a cold engine build
    # is under two minutes (95 s on the main PC, 1:44 on the ARM runner).
    # ⚠️Wasmtime joined the engine with the fx host (native/fx_plugin): a
    # cold build went from 60 to 315 s on the Surface (2026-11-08), paid by
    # every job here that builds it — not yet weighed against this choice
    # (connection-round-checklist H).
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('packages/gpu_engine/rust/Cargo.lock') }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-
    # The DXC zip rust/build.rs keeps outside every target folder
    # (`cached_zip`), so a job fetches it from GitHub's releases once per
    # pin rather than every run.
    - if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ~/AppData/Local/anicel-build/dxc
        key: dxc-${{ hashFiles('packages/gpu_engine/rust/build.rs') }}
    # The SDK example's native build, which the fx pin opens
    # (test/native/an_fx_plugin_answers_through_the_engine_test.dart, where
    # a job told QA_REQUIRE_NATIVE fails without it): the spec crate alone,
    # seconds, for this machine — so every job that tests has it. ↩️The C
    # engine's build made a C one beside the engine until 2026-11-08.
    - shell: bash
      working-directory: packages/gpu_engine/rust
      run: cargo build --locked --release -p fx_sdk_example --target-dir ../../../build/fx_native
