name: Run a test shard
description: >
  Runs the slice of test/**/*_test.dart that belongs to one shard. Splitting
  the FILE LIST is what makes sharding pay here — see the comment above the
  analyze-and-test job in ci.yml for why --total-shards does not.

inputs:
  total:
    description: How many shards the suite is split into.
    required: true
  index:
    description: Which shard this job runs (0-based, less than total).
    required: true

runs:
  using: composite
  steps:
    # `flutter test` seeds its resident compiler from a kernel it keeps in
    # build/test_cache (flutter_tools passes it as initializeFromDill, and
    # says in its own comment that the point is "to re-use as many packages
    # as possible"). CI has never kept that file, so every test job in every
    # run has compiled from cold — measured locally at +34.5% wall on a
    # 31-file sample, with the first file taking 37.4s instead of 5.3s.
    #
    # It is a compile SEED and nothing else: a stale one costs a recompile,
    # never a wrong answer. That is why an inexact restore-keys hit is
    # welcome here in a way it would not be for a build artefact.
    - id: kernel
      uses: actions/cache/restore@v4
      with:
        path: build/test_cache
        key: testkernel-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/workflows/ci.yml') }}-${{ github.run_id }}
        restore-keys: |
          testkernel-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/workflows/ci.yml') }}-
    - shell: bash
      run: |
        set -euo pipefail
        # Dealing the files out round-robin balanced the shards by COUNT,
        # and cost is not distributed like count: at eight Windows shards
        # the measured spread was still 1.64x (224s to 362s), so one
        # unlucky shard decided the round while the others sat finished.
        #
        # So weight each file and pack longest-first into the lightest
        # shard. The weight is the file's SIZE, not a recorded duration:
        # a checked-in timings table is more accurate on the day it is
        # generated and wrong every day after, and it goes stale silently
        # — the failure mode is a slow shard, which looks exactly like
        # normal. Size is 86% as good and cannot rot, because it is
        # measured from the tree being tested.
        #
        # Every shard job runs this same computation over the same commit
        # and takes only its own slice, so the deal MUST be deterministic:
        # hence the explicit sort (size descending, then path) under
        # LC_ALL=C. If two jobs disagreed, files would silently run twice
        # or not at all.
        # Batched wc -c rather than find -printf: -printf is GNU find's
        # own, and the macOS suite shards (apple.yml) run on BSD find,
        # which has no such option. One xargs batch keeps this at three
        # processes — a per-file loop measured 2+ minutes on a Windows
        # runner's fork costs. The awk drops xargs' per-batch "total"
        # rows and BSD wc's column padding while keeping any spaces in
        # the path itself.
        find test -name '*_test.dart' -print0 \
          | xargs -0 wc -c \
          | awk '{sz=$1; $1=""; sub(/^ /, "");
                  if ($0 != "total") printf "%s\t%s\n", sz, $0}' \
          | LC_ALL=C sort -k1,1nr -k2,2 > "$RUNNER_TEMP/weighted.txt"
        total_files=$(wc -l < "$RUNNER_TEMP/weighted.txt")
        # `want`, not `index` — index() is a gawk builtin and awk dies with
        # "cannot use gawk builtin as variable name", which on CI would be
        # every shard failing at once.
        awk -v total="${{ inputs.total }}" -v want="${{ inputs.index }}" '
          BEGIN { for (i = 0; i < total; i++) load[i] = 0 }
          {
            lightest = 0
            for (i = 1; i < total; i++) {
              if (load[i] < load[lightest]) lightest = i
            }
            load[lightest] += $1
            if (lightest == want) {
              sub(/^[0-9]+\t/, "")
              print
            }
          }
        ' "$RUNNER_TEMP/weighted.txt" > "$RUNNER_TEMP/shard_tests.txt"
        shard_files=$(wc -l < "$RUNNER_TEMP/shard_tests.txt")
        echo "shard ${{ inputs.index }} of ${{ inputs.total }}:" \
          "$shard_files of $total_files files"
        # A selector that matched nothing would otherwise sail through
        # green — the one way sharding could silently drop coverage.
        if [ "$shard_files" -eq 0 ]; then
          echo "shard selected no test files"
          exit 1
        fi
        # The slice runs by the run plan, as every list run goes
        # (tool/affected_tests.dart, ci-shards-crowd-the-collector-pins):
        # the pins that wait for the collector alone and last, the files
        # that need Impeller on their own engine (dart_test.yaml, the gpu
        # and impeller tags), each batch no longer than the command line
        # Windows takes. One `flutter test` for the whole slice put the
        # collector's pins in the crowd and every file on Skia; the
        # command-line limit this step carried was the plan's own, copied.
        # In this step, not a job of their own — a job is CI usage (the
        # 2026-08-31 suspension).
        #
        # --outside-the-line: the runner holds this one job, so there is no
        # machine's line to share, and on Windows the line would wait for
        # room it measures through PowerShell. --concurrency: what this
        # step's `flutter test` ran a shard at before — package:test's own
        # default, half the cores — so the move changes where files run,
        # not how many run at once.
        cores=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN)
        half=$(( cores / 2 ))
        [ "$half" -ge 1 ] || half=1
        dart run tool/affected_tests.dart \
          --files-from "$RUNNER_TEMP/shard_tests.txt" \
          --outside-the-line --concurrency "$half"
    # One writer per run per OS, and only from master: thirteen shards
    # racing to save the same key would leave twelve "cache already exists"
    # warnings, and a pull request has no business seeding the cache every
    # branch will then restore from. The run id keeps the seed moving
    # forward — restore-keys above matches the newest one with the same
    # prefix, so it is always a recent master rather than a frozen one.
    # Schedule counts as master here too: the macOS suite only ever runs
    # on schedule/dispatch, and without its own seed those shards would
    # compile cold every night.
    - if: (github.event_name == 'push' || github.event_name == 'schedule') && inputs.index == '0'
      uses: actions/cache/save@v4
      with:
        path: build/test_cache
        key: testkernel-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/workflows/ci.yml') }}-${{ github.run_id }}
