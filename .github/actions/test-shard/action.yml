name: Run a test shard
description: >
  Runs the slice of test/**/*_test.dart that belongs to one shard. Splitting
  the FILE LIST is what makes sharding pay here — see the comment above the
  analyze-and-test job in ci.yml for why --total-shards does not.

inputs:
  total:
    description: How many shards the suite is split into.
    required: true
  index:
    description: Which shard this job runs (0-based, less than total).
    required: true
  leave-out-package:
    description: >
      A package whose tests this runner cannot run — every test file that
      reaches it (tool/tests_reaching_package.dart) is left out before the
      deal. Empty leaves out nothing.
    required: false
    default: ''
  times-artifact:
    description: >
      The artifact this run's scope job left the record of CI's last run in
      (ci.yml) — `<os>.tsv`, each test file's milliseconds. The shard deals
      by it and leaves its own times for the next run. Empty deals by size
      alone and leaves nothing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # `flutter test` seeds its resident compiler from a kernel it keeps in
    # build/test_cache (flutter_tools passes it as initializeFromDill, and
    # says in its own comment that the point is "to re-use as many packages
    # as possible"). CI has never kept that file, so every test job in every
    # run has compiled from cold — measured locally at +34.5% wall on a
    # 31-file sample, with the first file taking 37.4s instead of 5.3s.
    #
    # It is a compile SEED and nothing else: a stale one costs a recompile,
    # never a wrong answer. That is why an inexact restore-keys hit is
    # welcome here in a way it would not be for a build artefact.
    - id: kernel
      uses: actions/cache/restore@v4
      with:
        path: build/test_cache
        key: testkernel-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/workflows/ci.yml') }}-${{ github.run_id }}
        restore-keys: |
          testkernel-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/workflows/ci.yml') }}-
    - if: inputs.times-artifact != ''
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.times-artifact }}
        path: ${{ runner.temp }}/shard-times
    - shell: bash
      run: |
        set -euo pipefail
        # Dealing the files out round-robin balanced the shards by COUNT,
        # and cost is not distributed like count: at eight Windows shards
        # the measured spread was still 1.64x (224s to 362s), so one
        # unlucky shard decided the round while the others sat finished.
        #
        # So weigh each file and pack longest-first into the lightest
        # shard — by the milliseconds it took in CI's last run, and by its
        # size where no run timed it (tool/test_shard.dart, which says why
        # and how, and test_seconds.dart's `dealt`, the deal this machine's
        # batches are cut by too). ↩️Till 2026-11-17 by size alone, here in
        # awk (card ci-shards-dealt-by-measured-seconds).
        #
        # Every shard job runs this same deal over the same commit and the
        # same record — the scope job fetched it once for all of them — and
        # takes only its own slice, so the deal MUST be deterministic. If
        # two jobs disagreed, files would silently run twice or not at all.
        #
        # The record is also laid over this runner's own (`seed`), so the
        # slice's run orders and batches its files by it — longest first.
        times=()
        record="$RUNNER_TEMP/shard-times/${{ runner.os }}.tsv"
        if [ -s "$record" ]; then
          times=(--times "$record")
          dart tool/test_shard.dart seed --times "$record"
        fi
        # Left out before the deal, not after it, so the shards that are
        # left stay even.
        leave=()
        if [ -n "${{ inputs.leave-out-package }}" ]; then
          dart tool/tests_reaching_package.dart \
            "${{ inputs.leave-out-package }}" > "$RUNNER_TEMP/left_out.txt"
          leave=(--leave-out "$RUNNER_TEMP/left_out.txt")
          echo "$(wc -l < "$RUNNER_TEMP/left_out.txt") test files reach" \
            "package:${{ inputs.leave-out-package }} — not run here"
        fi
        # ${a[@]+"${a[@]}"}: an empty array is "unbound" to the Mac's bash
        # 3.2 under set -u (apple-nightly runs this too).
        dart tool/test_shard.dart deal \
          --total "${{ inputs.total }}" --index "${{ inputs.index }}" \
          ${times[@]+"${times[@]}"} ${leave[@]+"${leave[@]}"} \
          > "$RUNNER_TEMP/shard_tests.txt"
        shard_files=$(wc -l < "$RUNNER_TEMP/shard_tests.txt")
        echo "shard ${{ inputs.index }} of ${{ inputs.total }}:" \
          "$shard_files files"
        # A selector that matched nothing would otherwise sail through
        # green — the one way sharding could silently drop coverage.
        if [ "$shard_files" -eq 0 ]; then
          echo "shard selected no test files"
          exit 1
        fi
        # The slice runs by the run plan, as every list run goes
        # (tool/affected_tests.dart, ci-shards-crowd-the-collector-pins):
        # the pins that wait for the collector alone and last, the files
        # that need Impeller on their own engine (dart_test.yaml, the gpu
        # and impeller tags), each batch no longer than the command line
        # Windows takes. One `flutter test` for the whole slice put the
        # collector's pins in the crowd and every file on Skia; the
        # command-line limit this step carried was the plan's own, copied.
        # In this step, not a job of their own — a job is CI usage (the
        # 2026-08-31 suspension).
        #
        # --outside-the-line: the runner holds this one job, so there is no
        # machine's line to share, and on Windows the line would wait for
        # room it measures through PowerShell. --concurrency: what this
        # step's `flutter test` ran a shard at before — package:test's own
        # default, half the cores — so the move changes where files run,
        # not how many run at once.
        #
        # ⛔`dart tool/…`, not `dart run tool/…`: `dart run` runs every
        # package's build hook for the Dart VM first — the GPU engine's
        # Rust among them — for a tool that imports none of them
        # (tool/session_hooks/guard_dart_run.sh; 관제 2026-11-08,
        # ci-dart-run-tools-build-the-engine-again). The release
        # workflows' parity runs are the same.
        cores=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN)
        half=$(( cores / 2 ))
        [ "$half" -ge 1 ] || half=1
        dart tool/affected_tests.dart \
          --files-from "$RUNNER_TEMP/shard_tests.txt" \
          --outside-the-line --concurrency "$half"
    # What this slice took, for the next run's deal — kept red or green,
    # and from a run cut short too: each batch that ended was timed. Only
    # this slice's files, so the shards' records never overlap and the
    # scope job's join of them needs no rule for two values of one file.
    # overwrite: a re-run of a failed shard lands in the same run.
    - if: always() && inputs.times-artifact != ''
      shell: bash
      run: |
        dart tool/test_shard.dart keep \
          --files "$RUNNER_TEMP/shard_tests.txt" \
          --to "$RUNNER_TEMP/test_times.tsv"
    - if: always() && inputs.times-artifact != ''
      uses: actions/upload-artifact@v5
      with:
        name: test-times-${{ runner.os }}-${{ inputs.index }}
        path: ${{ runner.temp }}/test_times.tsv
        retention-days: 14
        if-no-files-found: ignore
        overwrite: true
    # One writer per run per OS, and only from master: thirteen shards
    # racing to save the same key would leave twelve "cache already exists"
    # warnings, and a pull request has no business seeding the cache every
    # branch will then restore from. The run id keeps the seed moving
    # forward — restore-keys above matches the newest one with the same
    # prefix, so it is always a recent master rather than a frozen one.
    # Schedule counts as master here too: the macOS suite only ever runs
    # on schedule/dispatch, and without its own seed those shards would
    # compile cold every night.
    #
    # ⚖️Fewer master runs reach here since one whose tree a pull request
    # already tested green stands down (ci.yml's scope job, 2026-11-17), and
    # that was weighed: every Linux run since 11-06 found no seed, and the
    # seedless 11-06 shards reached their first test 14-20 s after the batch
    # began. 11-17's took 4.9 min, the Windows shards 7: what came between
    # is the GPU engine's Rust, built cold by the app's build hook (315 s on
    # the Surface, .github/actions/rust-engine) — not timed apart from the
    # compile here, but no seed of this cache reaches it.
    - if: (github.event_name == 'push' || github.event_name == 'schedule') && inputs.index == '0'
      uses: actions/cache/save@v4
      with:
        path: build/test_cache
        key: testkernel-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/workflows/ci.yml') }}-${{ github.run_id }}
