# Codemagic — the Mac this project does not own. Two workflows, both started
# by hand: TestFlight for the iPad, and a signed, notarized build of the Mac
# app for direct distribution.
#
# WHY THIS FILE EXISTS. The GitHub account was suspended on 2026-09-01 and
# Actions went with it. This is the second Mac, not a replacement: when the
# account comes back both point at the SAME signing identity and either can
# ship.
#
# 🚨SIGNING LIVES IN ONE PLACE. `ios/fastlane/Fastfile` is the only file that
# knows how to sign, notarize and upload; the workflows below hand it raw
# secrets and stop at "run the lane". A second description of signing here
# is exactly the copy this project refuses.
#
# ⚠️THE SIGNING IDENTITY MOVED. match kept it in a private GitHub repository,
# which the suspension locked away along with everything else; a new pair
# lives in a private GitLab repository now. `MATCH_GIT_URL` was already a
# secret rather than a literal, so only the value changed.
#
# ⛔NO `triggering:` SECTION, ON PURPOSE. Without one a workflow runs only
# when somebody starts it, which is what the GitHub workflow's
# `workflow_dispatch` buys. A build costs macOS minutes, and the iOS one a
# TestFlight slot, so it runs when somebody wants to hold the app.

# ONE definition of what both workflows share — the machine's toolchain, the
# secrets, and the Apple-side correctness check. YAML anchors, so the Mac
# workflow reuses the check rather than carrying a copy that could drift.
definitions:
  environment: &apple_environment
    flutter: 3.47.4
    xcode: latest
    cocoapods: default
    groups:
      # Apple: ASC_KEY_ID · ASC_ISSUER_ID · ASC_KEY_CONTENT · FASTLANE_TEAM_ID,
      # and the Mac's Developer ID: DEVELOPER_ID_P12 (base64) ·
      # DEVELOPER_ID_P12_PASSWORD — made once by the Account Holder, because
      # Apple will not let an API key make one.
      - appstore
      # The signing repository: MATCH_GIT_URL · MATCH_PASSWORD · MATCH_GIT_TOKEN
      - match
    vars:
      # Which username the signing repository's host wants beside the token.
      # GitLab takes `oauth2`; the Fastfile builds the header from this.
      MATCH_GIT_USER: oauth2

  scripts:
    - &flutter_dependencies
      name: Flutter dependencies
      script: flutter pub get

    # The Apple-side correctness check stays ON every shipping path. A check
    # the shipping path cannot skip is worth more than a thorough one
    # somewhere else — the nightly answers the same question, but a build is
    # not a nightly.
    - &native_core
      name: Native core (Apple clang)
      script: |
        cmake -S packages/qa_native/src -B build/ci-apple -DCMAKE_BUILD_TYPE=Release
        cmake --build build/ci-apple --config Release

    - &parity
      name: Parity against the Apple-built engine
      script: |
        set -euo pipefail
        # ⛔EXPORTED HERE, not in a per-step `environment:` block: that key
        # is a GitHub Actions shape and Codemagic would ignore it silently.
        # An ignored QA_REQUIRE_NATIVE is the one failure this step cannot
        # report — the suite would SKIP and still print "All tests passed".
        export QA_ENGINE_PATH="$CM_BUILD_DIR/build/ci-apple/libqa_engine.dylib"
        # A missing engine must FAIL rather than skip: a skipped parity suite
        # and a passing one look identical in a summary, which is exactly how
        # #614 hid for five rounds.
        export QA_REQUIRE_NATIVE=1
        # The selector is ONE script: these builds, the GitHub one and
        # `lane.sh land` ask the same question and must get one answer. It
        # exits 1 when it selects nothing, which fails this step under -e.
        list="$CM_BUILD_DIR/build/parity.txt"
        bash tool/native_parity_tests.sh > "$list"
        echo "parity subset: $(wc -l < "$list") of $(find test -name '*_test.dart' | wc -l) files"
        # 🚨A native crash says nothing in this log but "segmentation
        # fault" — the stack is in the crash report macOS writes beside it,
        # on a machine thrown away when the build ends. It is printed
        # before failing, or the next run is another guess: the first fix
        # for the Apple reader (2026-09-11) went into a function the crash
        # never reached.
        xargs flutter test --no-pub < "$list" || {
          status=$?
          python3 tool/print_mac_crash_reports.py
          exit $status
        }

workflows:
  ios-testflight:
    name: TestFlight (iOS)
    instance_type: mac_mini_m2
    # Long enough for a cold pod install and the native core, short enough
    # that a stalled build does not sit for an hour.
    max_build_duration: 45
    environment: *apple_environment

    scripts:
      - *flutter_dependencies
      - *native_core
      - *parity

      # Flutter's own artifacts first. fastlane's build_app then archives and
      # signs what this produced — signing here would be thrown away.
      #
      # ⚠️THE OFFSET IS NOT DECORATION. CFBundleVersion is
      # $(FLUTTER_BUILD_NUMBER) and App Store Connect refuses a build number it
      # has already seen for this version. GitHub's runs numbered the builds
      # that are already up there; Codemagic starts its own count at 1 and
      # would collide with every one of them. Adding 1000 puts this run above
      # anything Actions can have shipped, and both counters still only climb.
      - name: Build Flutter iOS artifacts
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$((BUILD_NUMBER + 1000))

      - name: Build and upload
        script: |
          cd ios
          bundle install
          # Non-interactive: a prompt on a runner is a 45-minute hang.
          export FASTLANE_SKIP_UPDATE_CHECK=1
          export FASTLANE_HIDE_CHANGELOG=1
          bundle exec fastlane ios beta

    artifacts:
      - ios/build/*.ipa
      # Where a signing failure explains itself. They outlive the machine
      # only if we say so.
      - /Users/builder/Library/Logs/gym/*.log

  macos-developer-id:
    name: macOS (Developer ID)
    instance_type: mac_mini_m2
    # The Mac build signs, archives and then waits on Apple's notary service.
    # ⚠️120, Codemagic's ceiling: the FIRST notarization of the new Developer
    # ID (2026-09-11) was still waiting after more than 20 minutes, inside a
    # 60-minute budget for the whole build. A build killed mid-wait throws
    # away an app Apple was about to accept, and the next run waits again.
    max_build_duration: 120
    environment: *apple_environment

    scripts:
      - *flutter_dependencies

      # FIRST, AND ON ITS OWN: a missing or mistyped Developer ID secret costs
      # a minute here instead of a whole build. It began as the test of
      # whether Apple would let the API key make the certificate; Apple would
      # not, and the Fastfile says where the certificate comes from instead.
      - name: Signing identity (Developer ID)
        script: |
          cd ios
          bundle install
          export FASTLANE_SKIP_UPDATE_CHECK=1
          export FASTLANE_HIDE_CHANGELOG=1
          bundle exec fastlane mac identity

      - *native_core
      - *parity

      # Flutter's build first, as on iOS: it installs the pods and writes the
      # configuration the archive below reads. Its own signature — "sign to
      # run locally" — is replaced by the lane.
      - name: Build Flutter macOS
        script: |
          flutter build macos --release \
            --build-number=$((BUILD_NUMBER + 1000))

      - name: Sign, notarize, package
        script: |
          cd ios
          bundle install
          export FASTLANE_SKIP_UPDATE_CHECK=1
          export FASTLANE_HIDE_CHANGELOG=1
          bundle exec fastlane mac developer_id

    artifacts:
      # The zipped, stapled app — the file that goes to a tester.
      - ios/build/mac/*.zip
      - /Users/builder/Library/Logs/gym/*.log
