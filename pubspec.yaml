name: anicel
description: "Anicel — a 2D hand-drawn animation production tool."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# 0.x while the save format is still free to change. This string is also
# what decides how often TestFlight's external testers wait: Apple runs a
# Beta App Review on the first build of every VERSION, so bumping even the
# patch digit costs a day. The build number carries the churn instead — CI
# passes --build-number from the run number — so this line should sit
# still until a real milestone.
version: 0.1.0+1

environment:
  sdk: ^3.11.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  sqlite3: ^3.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  archive: ^4.0.9
  ffi: ^2.2.0
  # Matrix4 for the layer POSE, which services need and may not reach
  # through flutter/widgets — the dependency direction CI enforces bans the
  # widget framework below the UI layer (lib/src/services/layer_pose_matrix).
  vector_math: ^2.2.0
  # The native core as an FFI plugin (2A): each platform's own toolchain
  # compiles packages/qa_native/src and ships the result with the app.
  qa_native:
    path: packages/qa_native
  pdf: ^3.13.0
  desktop_drop: ^0.7.1
  pdfrx: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Already in the graph via file_selector; declared so tests can swap
  # FileSelectorPlatform.instance and reach the REAL desktop picker call
  # sites — the debug seams sit above them, so seam tests cannot see a
  # call site dropping the F-14 hint retry.
  file_selector_platform_interface: ^2.7.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # `tool/code_map.dart` parses `lib/` to answer the audit's structural
  # questions — how long is this function, how many ways are there through it,
  # how many files would notice if it moved. A line-based grep answered the
  # same questions and was measurably wrong: it counted 1,596 types where the
  # parser counts 1,631, missing every `abstract final class` (31) and
  # `abstract interface class` (4) because its pattern allowed one modifier.
  # The whole audit ranks by these numbers, so it inherits whatever error is
  # in them.
  #
  # ⚠️dev only — nothing under `lib/` may import it and the app does not ship
  # it. ⚠️analyzer 13 renamed parts of the AST (`ClassDeclaration.namePart`,
  # `.body.members`); read the package before writing against it.
  analyzer: ^13.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ⚠️This asset entry covers EVERY file in assets/fonts/ — the UI faces
  # declared under `fonts:` below AND the conte PDF's two, which the PDF
  # writer loads by name through rootBundle rather than as a family.
  #
  # 콘티 PDF: M PLUS 1p 가 라틴+가나+한자, IBM Plex Sans KR 이 한글.
  assets:
    - assets/fonts/
    - assets/licenses/

  # 🚨THE APP UI's OWN FACE (유저 확정 2026-08-28). The app used to have no
  # font of its own and wore whatever the OS handed it, so the same screen
  # read differently on Windows, macOS and Android.
  #
  # BIZ UDPGothic is a UD (Universal Design) face — 유저: 「작은크기 가독성
  # 목표로해서 아주 읽기쉬워」 — which is the property this app needs most:
  # a 27px rail row carries 12px names and a 9px label chip.
  #
  # ⚠️It has no Hangul (measured: 0/11172), so 나눔고딕 stands behind
  # it — see `AppTypography` for why the ORDER is what routes each script.
  fonts:
    - family: BIZ UDPGothic
      fonts:
        - asset: assets/fonts/BIZUDPGothic-Regular.ttf
        - asset: assets/fonts/BIZUDPGothic-Bold.ttf
          weight: 700
    - family: Nanum Gothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
        - asset: assets/fonts/NanumGothic-Bold.ttf
          weight: 700

  # Fragment shaders. `flutter: shaders:` compiles each to the SPIR-V a
  # `FragmentProgram.fromAsset` loads; the path here is the asset key.
  shaders:
    - shaders/colour_key.frag

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
